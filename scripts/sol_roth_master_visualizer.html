<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>Sol Roth - 3D Master Audio-Reactive Visualizer</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; user-select: none; -webkit-user-select: none; }
    html, body {
      width: 100%; height: 100%; overflow: hidden; background-color: #010206;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", sans-serif;
      color: #fff;
    }
    
    #cinematic-grain {
      position: fixed;
      top: 0; left: 0;
      width: 100vw; height: 100vh;
      pointer-events: none;
      z-index: 12;
      opacity: 0.08;
      mix-blend-mode: screen;
    }

    #webgl-canvas {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%; display: block; z-index: 1;
    }

    /* Stage HUD: Responsive Two-Tier Layout (Optimized for iPhone Safari & Studio Displays) */
    .stage-hud {
      position: absolute; top: 0; left: 0; width: 100%; z-index: 20;
      padding: env(safe-area-inset-top, 8px) 12px 6px 12px;
      display: flex; flex-direction: column; gap: 6px;
      pointer-events: none;
      background: linear-gradient(180deg, rgba(1, 2, 6, 0.95) 0%, rgba(1, 2, 6, 0.75) 75%, rgba(1, 2, 6, 0) 100%);
      transition: opacity 0.3s ease;
    }
    .stage-hud.hidden { opacity: 0; pointer-events: none; }

    /* Tier 1: Brand Header & Action Controls */
    .hud-tier-top {
      display: flex; justify-content: space-between; align-items: center; gap: 8px; width: 100%;
    }
    .brand-group {
      display: flex; align-items: center; gap: 8px; pointer-events: auto; flex-shrink: 0;
    }
    .brand-title {
      font-size: 0.85rem; font-weight: 900; letter-spacing: 2px;
      background: linear-gradient(90deg, #00f0ff, #ffffff, #ff0077);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      text-transform: uppercase;
    }
    .badge-live {
      background: rgba(0, 240, 255, 0.15); border: 1px solid #00f0ff; color: #00f0ff;
      font-size: 0.6rem; font-weight: 800; padding: 2px 6px; border-radius: 4px;
      letter-spacing: 1px; text-transform: uppercase;
    }
    .telemetry-tag {
      font-size: 0.68rem; font-family: monospace; color: #94a3b8; letter-spacing: 0.5px;
    }
    @media (max-width: 600px) {
      .telemetry-tag { display: none; }
    }

    .event-actions {
      display: flex; align-items: center; gap: 5px; pointer-events: auto; flex-wrap: nowrap; overflow-x: auto;
      scrollbar-width: none; -webkit-overflow-scrolling: touch;
    }
    .event-actions::-webkit-scrollbar { display: none; }

    .btn-action {
      background: rgba(15, 23, 42, 0.85); border: 1px solid rgba(255, 255, 255, 0.15);
      color: #cbd5e1; padding: 5px 9px; font-size: 0.68rem; font-weight: 700;
      border-radius: 6px; cursor: pointer; backdrop-filter: blur(8px);
      transition: all 0.15s ease; white-space: nowrap; touch-action: manipulation;
    }
    .btn-action:active { transform: scale(0.95); }
    .btn-action.btn-danger { border-color: rgba(239, 68, 68, 0.5); color: #f87171; }
    .btn-action.btn-storm { border-color: rgba(234, 179, 8, 0.5); color: #facc15; }
    .btn-action.btn-char-ctrl { border-color: rgba(6, 182, 212, 0.7); color: #67e8f9; }
    .btn-action.btn-char-ctrl.active { background: rgba(6, 182, 212, 0.35); box-shadow: 0 0 12px rgba(6, 182, 212, 0.6); color: #ffffff; }
    .btn-action.btn-char-ctrl:disabled, .btn-action.btn-char-ctrl.disabled {
      opacity: 0.25 !important; pointer-events: none !important;
      border-color: rgba(255, 255, 255, 0.08) !important; color: rgba(255, 255, 255, 0.25) !important;
      filter: grayscale(1);
    }
    .btn-action.btn-resetcam { border-color: rgba(59, 130, 246, 0.6); color: #93c5fd; }
    .btn-action.btn-portal { border-color: rgba(16, 185, 129, 0.7); color: #6ee7b7; }
    .btn-action.btn-portal.closed { border-color: rgba(239, 68, 68, 0.85); color: #fca5a5; background: rgba(239, 68, 68, 0.22); box-shadow: 0 0 12px rgba(239, 68, 68, 0.45); }
    .btn-action.btn-portal.cycling { border-color: rgba(245, 158, 11, 0.85); color: #fcd34d; background: rgba(245, 158, 11, 0.22); }

    /* Tier 2: Horizontal Touch-Scrolling Scene Selector */
    .hud-tier-scenes {
      display: flex; align-items: center; gap: 4px; pointer-events: auto;
      overflow-x: auto; width: 100%; padding-bottom: 2px;
      scrollbar-width: none; -webkit-overflow-scrolling: touch;
    }
    .hud-tier-scenes::-webkit-scrollbar { display: none; }

    .btn-scene {
      background: rgba(15, 23, 42, 0.7); border: 1px solid rgba(255, 255, 255, 0.08);
      color: #94a3b8; padding: 4px 10px; font-size: 0.64rem; font-weight: 700;
      border-radius: 5px; cursor: pointer; white-space: nowrap; touch-action: manipulation;
      transition: all 0.15s ease; flex-shrink: 0;
    }
    .btn-scene:hover { color: #fff; background: rgba(255, 255, 255, 0.1); }
    .btn-scene.active {
      background: linear-gradient(135deg, rgba(239, 68, 68, 0.35) 0%, rgba(245, 158, 11, 0.35) 100%);
      border-color: #f59e0b; color: #ffffff;
      box-shadow: 0 0 14px rgba(239, 68, 68, 0.45);
    }

    /* Audio Spectrum Monitor */
    .spectrum-monitor {
      position: absolute; bottom: 12px; left: 12px; z-index: 20; pointer-events: none;
      background: rgba(1, 2, 6, 0.85); border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 8px 12px; border-radius: 8px; backdrop-filter: blur(10px);
      display: flex; flex-direction: column; gap: 6px;
      transition: opacity 0.3s ease;
    }
    .spectrum-monitor.hidden { opacity: 0; pointer-events: none; }
    .spectrum-header {
      display: flex; justify-content: space-between; align-items: center; gap: 12px;
    }
    .spectrum-title {
      font-size: 0.64rem; font-weight: 800; color: #00f0ff; letter-spacing: 1.2px; text-transform: uppercase;
    }
    .spectrum-fps {
      font-size: 0.62rem; font-weight: 700; color: #10b981; font-family: monospace;
    }
    #spectrum-canvas {
      width: 150px; height: 32px; display: block; border-radius: 3px; background: rgba(0, 0, 0, 0.5);
    }

    /* Emergency Override / Protocol Red Overlay */
    .override-overlay {
      position: absolute; top: 0; left: 0; width: 100%; height: 100%; z-index: 15;
      display: flex; flex-direction: column; justify-content: center; align-items: center;
      background: radial-gradient(circle, rgba(255, 0, 50, 0.3) 0%, rgba(10, 0, 5, 0.9) 100%);
      pointer-events: none; opacity: 0; transition: opacity 0.25s ease;
    }
    .override-overlay.active { opacity: 1; }
    .override-card {
      border: 3px solid #ff0044; background: rgba(15, 2, 5, 0.94);
      padding: 20px 36px; border-radius: 12px; text-align: center;
      box-shadow: 0 0 50px rgba(255, 0, 68, 0.8), inset 0 0 30px rgba(255, 0, 68, 0.4);
      animation: alertPulse 0.6s infinite alternate; margin: 0 16px;
    }
    @keyframes alertPulse {
      0% { transform: scale(0.98); border-color: #ff0044; box-shadow: 0 0 30px rgba(255, 0, 68, 0.6); }
      100% { transform: scale(1.02); border-color: #ff5577; box-shadow: 0 0 70px rgba(255, 0, 68, 1); }
    }
    .override-title {
      font-size: 1.8rem; font-weight: 900; letter-spacing: 4px; color: #ff0044;
      text-transform: uppercase; text-shadow: 0 0 20px #ff0044;
    }
    .override-sub {
      font-size: 0.95rem; font-weight: 800; letter-spacing: 3px; color: #ffcc00;
      margin-top: 6px; text-transform: uppercase;
    }

    /* Compact Audio Input Header Icon */
    .btn-audio-icon {
      background: rgba(30, 41, 59, 0.85);
      border: 1px solid rgba(0, 240, 255, 0.4);
      border-radius: 8px;
      padding: 4px 8px;
      font-size: 0.85rem;
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      color: #38bdf8;
      transition: all 0.2s ease;
      touch-action: manipulation;
    }
    .btn-audio-icon:hover {
      background: rgba(0, 240, 255, 0.2);
      border-color: #00f0ff;
      color: #fff;
    }
    .btn-audio-icon.idle-pulse {
      animation: micGlow 1.8s infinite ease-in-out;
    }
    @keyframes micGlow {
      0% { box-shadow: 0 0 0px rgba(0, 240, 255, 0.2); border-color: rgba(0, 240, 255, 0.4); }
      50% { box-shadow: 0 0 10px rgba(0, 240, 255, 0.8); border-color: #00f0ff; color: #fff; }
      100% { box-shadow: 0 0 0px rgba(0, 240, 255, 0.2); border-color: rgba(0, 240, 255, 0.4); }
    }
    .btn-audio-icon.active {
      border-color: #10b981;
      color: #10b981;
      box-shadow: 0 0 10px rgba(16, 185, 129, 0.6);
      animation: none;
      position: relative;
    }
    .btn-audio-icon.active::after {
      content: "";
      position: absolute;
      top: -2px; right: -2px;
      width: 6px; height: 6px;
      border-radius: 50%;
      background: #10b981;
      box-shadow: 0 0 6px #10b981;
    }
    .btn-audio-icon.error {
      border-color: #ef4444;
      color: #ef4444;
      box-shadow: 0 0 10px rgba(239, 68, 68, 0.6);
    }

    /* Anamorphic Horizontal Lens Flare Glint (Transient Spike Cheat) */
    .glint-flare {
      position: fixed;
      top: 50%;
      left: 0;
      width: 100vw;
      height: 3px;
      transform: translateY(-50%);
      background: linear-gradient(90deg, transparent 0%, rgba(0, 240, 255, 0.9) 35%, #ffffff 50%, rgba(244, 63, 94, 0.9) 65%, transparent 100%);
      filter: blur(0.8px) drop-shadow(0 0 16px #00f0ff);
      opacity: 0;
      pointer-events: none;
      z-index: 25;
      transition: opacity 0.06s ease-out;
    }
    .glint-flare.active {
      opacity: 0.95;
    }
  
    /* Storm Strobe Flash Overlay */
    #storm-strobe-overlay {
      position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
      pointer-events: none; z-index: 90; opacity: 0;
      background: radial-gradient(circle at 50% 40%, rgba(255, 255, 255, 0.98) 0%, rgba(245, 158, 11, 0.55) 45%, rgba(220, 38, 38, 0.35) 75%, transparent 100%);
      mix-blend-mode: screen; transition: opacity 0.05s ease-out;
    }

    /* Color Shift Lighting Gel Overlay */
    #color-grade-overlay {
      position: fixed;
      top: 0; left: 0; width: 100vw; height: 100vh;
      pointer-events: none;
      z-index: 7;
      mix-blend-mode: color;
      opacity: 0;
      transition: opacity 0.4s ease, background 0.4s ease;
    }
    #color-grade-overlay.mode-1 {
      opacity: 0.65;
      background: radial-gradient(circle at 50% 50%, rgba(239, 68, 68, 0.5) 0%, rgba(153, 27, 27, 0.85) 100%);
    }
    #color-grade-overlay.mode-2 {
      opacity: 0.60;
      background: radial-gradient(circle at 50% 50%, rgba(245, 158, 11, 0.5) 0%, rgba(180, 83, 9, 0.85) 100%);
    }
    #color-grade-overlay.mode-3 {
      opacity: 0.65;
      background: radial-gradient(circle at 50% 50%, rgba(168, 85, 247, 0.5) 0%, rgba(79, 70, 229, 0.85) 100%);
    }

    /* Sol Roth Brand & Marketing Announcement Billboard Overlay */
    #brand-billboard {
      position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
      display: flex; align-items: center; justify-content: center;
      z-index: 85; pointer-events: auto;
      opacity: 0; transform: scale(0.96); pointer-events: none;
      transition: opacity 0.4s cubic-bezier(0.16, 1, 0.3, 1), transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
      background: radial-gradient(circle at center, rgba(3, 6, 15, 0.78) 0%, rgba(1, 2, 6, 0.94) 100%);
      backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px);
    }
    #brand-billboard.active {
      opacity: 1; transform: scale(1.0); pointer-events: auto;
    }
    .billboard-container {
      position: relative; max-width: 900px; width: 92%;
      background: linear-gradient(135deg, rgba(15, 23, 42, 0.94) 0%, rgba(4, 6, 13, 0.98) 100%);
      border: 1px solid rgba(245, 158, 11, 0.4); border-radius: 14px;
      box-shadow: 0 0 60px rgba(0, 0, 0, 0.95), 0 0 35px rgba(245, 158, 11, 0.25), inset 0 0 20px rgba(255, 255, 255, 0.03);
      padding: 32px 36px; display: flex; flex-direction: column; align-items: center; text-align: center;
      overflow: hidden;
    }
    .billboard-container::before {
      content: ''; position: absolute; top: -50%; left: -50%; width: 200%; height: 200%;
      background: linear-gradient(45deg, transparent 45%, rgba(245, 158, 11, 0.06) 50%, transparent 55%);
      pointer-events: none; animation: scanlineGlint 6s infinite linear;
    }
    @keyframes scanlineGlint {
      0% { transform: translate(-20%, -20%); }
      100% { transform: translate(20%, 20%); }
    }
    .billboard-close-btn {
      position: absolute; top: 16px; right: 18px;
      background: rgba(255, 255, 255, 0.08); border: 1px solid rgba(255, 255, 255, 0.2);
      color: #94a3b8; font-size: 1rem; width: 34px; height: 34px; border-radius: 50%;
      cursor: pointer; display: flex; align-items: center; justify-content: center;
      transition: all 0.2s ease;
    }
    .billboard-close-btn:hover { background: #dc2626; color: #fff; border-color: #dc2626; }
    .billboard-badge {
      display: inline-flex; align-items: center; gap: 8px;
      padding: 5px 14px; border-radius: 20px; font-size: 0.72rem; font-weight: 900; letter-spacing: 2px;
      text-transform: uppercase; margin-bottom: 18px;
      background: rgba(245, 158, 11, 0.15); border: 1px solid #f59e0b; color: #f59e0b;
    }
    .billboard-logo-img {
      max-width: 580px; width: 85%; max-height: 220px; object-fit: contain;
      filter: drop-shadow(0 0 25px rgba(245, 158, 11, 0.35)) drop-shadow(0 0 10px rgba(255, 255, 255, 0.5));
      margin: 12px 0 20px 0; border-radius: 8px;
      transition: transform 0.3s ease;
    }
    .billboard-title {
      font-size: 1.85rem; font-weight: 900; letter-spacing: 2px;
      background: linear-gradient(90deg, #ffffff, #f59e0b, #ffffff);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
      margin-bottom: 8px; text-transform: uppercase;
    }
    .billboard-desc {
      font-size: 1.05rem; font-weight: 600; color: #cbd5e1; max-width: 650px;
      line-height: 1.5; margin-bottom: 24px; letter-spacing: 0.5px;
    }
    .billboard-footer {
      display: flex; gap: 12px; align-items: center; justify-content: center; width: 100%; flex-wrap: wrap;
    }
    .billboard-nav-btn {
      background: rgba(30, 41, 59, 0.8); border: 1px solid rgba(255, 255, 255, 0.2);
      color: #e2e8f0; font-size: 0.8rem; font-weight: 800; padding: 8px 18px; border-radius: 6px;
      cursor: pointer; transition: all 0.2s ease; text-transform: uppercase; letter-spacing: 1px;
    }
    .billboard-nav-btn:hover { background: #f59e0b; color: #000; border-color: #f59e0b; }
    .billboard-dot-row {
      display: flex; gap: 8px; align-items: center; margin: 0 10px;
    }
    .billboard-dot {
      width: 9px; height: 9px; border-radius: 50%; background: rgba(255, 255, 255, 0.25);
      transition: all 0.25s ease; cursor: pointer;
    }
    .billboard-dot.active { background: #f59e0b; box-shadow: 0 0 10px #f59e0b; transform: scale(1.25); }

    .btn-story {
      border-color: rgba(139, 92, 246, 0.7) !important;
      color: #c4b5fd !important;
      background: rgba(139, 92, 246, 0.12) !important;
    }
    .btn-story:hover {
      background: rgba(139, 92, 246, 0.28) !important;
      box-shadow: 0 0 12px rgba(139, 92, 246, 0.45);
    }

    /* Clean Stage Mode (for LED Wall / Secondary Output) */
    body.stage-mode #stage-hud,
    body.stage-mode #brand-billboard,
    body.stage-mode #audio-meter-wrap,
    body.stage-mode .badge-live,
    body.stage-mode #spectrum-monitor {
      display: none !important;
    }
    body.stage-mode {
      cursor: none !important;
    }
  </style>

  <!-- Locally Vendored Three.js & Post-Processing Libraries (100% Offline Reliable) -->
  <script src="/visualizer_lib/three.min.js"></script>
  <script src="/visualizer_lib/OrbitControls.js"></script>
  <script src="/visualizer_lib/EffectComposer.js"></script>
  <script src="/visualizer_lib/RenderPass.js"></script>
  <script src="/visualizer_lib/CopyShader.js"></script>
  <script src="/visualizer_lib/LuminosityHighPassShader.js"></script>
  <script src="/visualizer_lib/ShaderPass.js"></script>
  <script src="/visualizer_lib/UnrealBloomPass.js"></script>
</head>
<body>

  <!-- Strobe Flash & Lightning Thunder Overlay -->
  <div id="storm-strobe-overlay"></div>
  <div id="color-grade-overlay"></div>

  <!-- Hero Sol Roth Brand & Marketing Announcement Billboard -->
  <div id="brand-billboard">
    <div class="billboard-container">
      <button class="billboard-close-btn" onclick="toggleBillboard(false)">✕</button>
      <div class="billboard-badge" id="bb-badge">⚡ SOL ROTH LIVE PERFORMANCE</div>
      <img id="bb-image" class="billboard-logo-img" src="/vj_assets/logos/sol_roth_logo_dark.jpg" alt="Sol Roth">
      <div class="billboard-title" id="bb-title">SOL ROTH // LIVE ELECTRONIC</div>
      <div class="billboard-desc" id="bb-desc">BASS MUSIC WITH LIVE HANDS // HYPER-REACTIVE STAGE EXPERIENCE</div>
      <div class="billboard-footer">
        <button class="billboard-nav-btn" onclick="cycleBillboardPreset(-1)">◀ PREV</button>
        <div class="billboard-dot-row" id="bb-dots">
          <div class="billboard-dot active" onclick="setBillboardPreset(0)"></div>
          <div class="billboard-dot" onclick="setBillboardPreset(1)"></div>
          <div class="billboard-dot" onclick="setBillboardPreset(2)"></div>
          <div class="billboard-dot" onclick="setBillboardPreset(3)"></div>
        </div>
        <button class="billboard-nav-btn" onclick="cycleBillboardPreset(1)">NEXT ▶</button>
      </div>
    </div>
  </div>

  <!-- Stage Controls HUD (Two-Tier Mobile Responsive) -->
  <div class="stage-hud" id="stage-hud">
    <!-- Tier 1: Brand & Actions -->
    <div class="hud-tier-top">
      <div class="brand-group">
        <span class="badge-live">STAGE 4K</span>
        <button id="btn-audio-toggle" class="btn-audio-icon idle-pulse" onclick="enableAudioInput()" title="Tap to connect Live Audio (Mic/FLX10)">🎙️</button>
        <span class="brand-title">SOL ROTH</span>
        <span class="telemetry-tag" id="hud-telemetry">128 BPM // 8A</span>
      </div>

      <div class="event-actions">
        <button class="btn-action btn-story" id="btn-story-select" onclick="cycleStorySet()" style="border-color: #8b5cf6; color: #c4b5fd;" title="Switch Narrative Story Set (Key T)">📚 Story: Axiom</button>
        <button class="btn-action" id="btn-autoflow" onclick="toggleAutoFlow()" title="Auto-advance scenes every few minutes">⏱️ Flow: OFF</button>
        <!-- Character / Entity Controls (Dynamically active on entity scenes, disabled on environment scenes) -->
        <button class="btn-action btn-char-ctrl" id="btn-char-pose" onclick="triggerScenePose()" title="Cycle Entity Pose (Key P)">🧍 Pose: IDLE</button>
        <button class="btn-action btn-char-ctrl" id="btn-char-reach" onclick="triggerSceneReach()" title="Dramatic Hand Reach Toward Screen (Key K)">🖐️ Reach</button>
        <button class="btn-action btn-char-ctrl" id="btn-char-roar" onclick="triggerSceneRoar()" title="Entity Climax Roar / Ascend (Key L)">⚡ Roar</button>
        <button class="btn-action btn-char-ctrl" id="btn-char-autopose" onclick="toggleAutoPose()" title="Toggle Autonomous Posing">🤖 Auto Pose: ON</button>
        <!-- Cinematic Portal / Hatch Transition Controls -->
        <button class="btn-action btn-portal" id="btn-portal-toggle" onclick="togglePortal()" title="Toggle Foreground Portal / Blast Hatch (Key G)">🚪 Portal: OPEN</button>
        <button class="btn-action btn-portal" id="btn-portal-style" onclick="cyclePortalStyle()" title="Cycle Portal Aesthetic Style (Key J)">⚙️ Style: Hatch</button>
        <button class="btn-action btn-portal" id="btn-portal-auto" onclick="toggleAutoPortal()" title="Auto-close portal on scene changes (Key Y)">⚡ Auto Portal: ON</button>
        <button class="btn-action btn-resetcam" id="btn-reset-cam" onclick="resetSceneCamera()" title="Reset Camera to Perfect Framing (Key R)">🎯 Reset Cam</button>
        <button class="btn-action" id="btn-cammode" onclick="toggleCamMode()" title="Toggle Camera Mode: AUTO / DRIFT / FIXED (Key C)">📷 Cam: AUTO</button>
        <button class="btn-action" id="btn-camspeed" onclick="toggleCamSpeed()" title="Toggle Camera Speed / Choreography">⏱️ Sway: Normal</button>
        <button class="btn-action btn-storm" onclick="triggerEvent('storm')" title="Trigger Thunderstorm & Lightning Strobe (Key S)">⚡ Storm</button>
        <button class="btn-action" id="btn-flip" onclick="triggerEvent('flip')" title="Vertical Camera Invert / Vertigo Flip (Key V)">🌀 Flip</button>
        <button class="btn-action" id="btn-color" onclick="triggerEvent('colorshift')" title="Color Shift / Dynamic Tint (Key X)">🎨 Color: Normal</button>
        <button class="btn-action" id="btn-announce" onclick="toggleBillboard()" style="border-color: rgba(245, 158, 11, 0.6); color: #f59e0b;" title="Hero Brand Billboard & Announcement (Key A)">📢 Announce</button>
        <button class="btn-action" id="btn-hyperdrive" onclick="triggerEvent('hyperdrive')" style="background: linear-gradient(135deg, #2563eb, #06b6d4); color: #fff; display: none;">🚀 Warp Boost</button>
        <button class="btn-action" id="btn-mechamode" onclick="toggleMechaMode()" style="background: linear-gradient(135deg, #d97706, #ef4444); color: #fff; display: none;">⚔️ Mode: Bay 4</button>
        <button class="btn-action" id="btn-blackout" onclick="triggerEvent('blackout')">🌑 Blackout</button>
        <button class="btn-action btn-danger" onclick="triggerEvent('override')">🚨 Override</button>
        <button class="btn-action" onclick="triggerEvent('zoom')">🔍 Zoom</button>
        <button class="btn-action" onclick="toggleFullscreen()">⛶ Full</button>
      </div>
    </div>

    <!-- Tier 2: Horizontal Touch-Scrolling 12-Scene Bar -->
    <div class="hud-tier-scenes">
      <button class="btn-scene active" onclick="switchScene(0)">1. Core</button>
      <button class="btn-scene" onclick="switchScene(1)">2. Sphere</button>

    function updateCyberTexture(t, bands) {
      if (!cyberCtx) return;
      const ctx = cyberCtx;
      ctx.fillStyle = '#020617';
      ctx.fillRect(0, 0, 512, 320);

      // Cyan Grid Lines
      ctx.strokeStyle = 'rgba(0, 240, 255, 0.15)';
      ctx.lineWidth = 1;
      for (let x = 0; x <= 512; x += 40) {
        ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, 320); ctx.stroke();
      }
      for (let y = 0; y <= 320; y += 32) {
        ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(512, y); ctx.stroke();
      }

      // Audio-Reactive Oscilloscope Waveform
      ctx.strokeStyle = '#00f0ff';
      ctx.lineWidth = 3;
      ctx.beginPath();
      for (let x = 0; x < 512; x += 8) {
        const y = 160 + Math.sin(x * 0.04 + t * 6) * (20 + bands.sub * 65) + Math.cos(x * 0.08 - t * 4) * (12 + bands.energy * 25);
        if (x === 0) ctx.moveTo(x, y); else ctx.lineTo(x, y);
      }
      ctx.stroke();

      // Audio Spectrum Equalizer Bars
      ctx.fillStyle = 'rgba(255, 0, 119, 0.85)';
      const bars = 16;
      const barW = 16;
      for (let b = 0; b < bars; b++) {
        const h = 20 + Math.sin(b * 0.6 + t * 8) * 15 + ((b < 4) ? bands.sub * 85 : (b < 10) ? bands.mids * 65 : bands.highs * 45);

      }

      // Radar Dial
      ctx.strokeStyle = '#f59e0b';
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(430, 75, 42, 0, Math.PI * 2);
      ctx.stroke();
      ctx.beginPath();
      ctx.moveTo(430, 75);
      ctx.lineTo(430 + Math.cos(t * 4) * 42, 75 + Math.sin(t * 4) * 42);
      ctx.stroke();

      // Telemetry HUD Text

      ctx.font = 'bold 15px monospace';
      ctx.fillText('// SOL ROTH STAGE NEXUS', 20, 30);
      ctx.fillStyle = '#00f0ff';

    function createCircuitTexture() {
      const c = document.createElement('canvas');
      c.width = 512; c.height = 512;
      const ctx = c.getContext('2d');
      ctx.fillStyle = '#04060d'; // Deep obsidian base
      ctx.fillRect(0, 0, 512, 512);

      // Micro PCB Grid points (Subtle charcoal gold)
      ctx.fillStyle = 'rgba(245, 158, 11, 0.10)';
      for (let x = 16; x < 512; x += 32) {
        for (let y = 16; y < 512; y += 32) {
          ctx.fillRect(x - 1, y - 1, 2, 2);
        }
      }

      // Harmonized Matte Palette: Warm Gold, Pure White, and Laser Red Traces (Zero Magenta / Cyan)
      ctx.lineWidth = 3;
      for (let i = 0; i < 40; i++) {
        const traceColor = (i % 3 === 0) ? '#f59e0b' : (i % 3 === 1) ? '#ffffff' : '#dc2626';
        ctx.strokeStyle = traceColor;
        ctx.shadowColor = traceColor;
        ctx.shadowBlur = 5;
        ctx.beginPath();
        let x = Math.floor(Math.random() * 16) * 32 + 16;
        let y = Math.floor(Math.random() * 16) * 32 + 16;
        ctx.moveTo(x, y);
        for (let step = 0; step < 4; step++) {
          if (Math.random() > 0.5) {
            x += (Math.random() > 0.5 ? 64 : -64);
          } else {
            y += (Math.random() > 0.5 ? 64 : -64);
          }
          x = Math.max(16, Math.min(496, x));
          y = Math.max(16, Math.min(496, y));
          ctx.lineTo(x, y);
        }
        ctx.stroke();

        // High-precision gold and pure white solder pads
        ctx.fillStyle = (i % 2 === 0) ? '#f59e0b' : '#ffffff';
        ctx.beginPath();
        ctx.arc(x, y, 3.5, 0, Math.PI * 2);
        ctx.fill();
      }
      ctx.shadowBlur = 0;

      const tex = new THREE.CanvasTexture(c);
      tex.wrapS = THREE.RepeatWrapping;
      tex.wrapT = THREE.RepeatWrapping;
      tex.minFilter = THREE.LinearFilter;
      return tex;
    }

    function createHullPanelsTexture() {
      const c = document.createElement('canvas');
      c.width = 512; c.height = 512;
      const ctx = c.getContext('2d');
      ctx.fillStyle = '#060a14';
      ctx.fillRect(0, 0, 512, 512);

      // Micro-grain brushed metal streaks
      for (let i = 0; i < 350; i++) {
        const y = Math.random() * 512;
        const len = 30 + Math.random() * 140;
        const x = Math.random() * 512;
        ctx.strokeStyle = `rgba(255, 255, 255, ${0.015 + Math.random() * 0.035})`;
        ctx.lineWidth = 1;
        ctx.beginPath();
        ctx.moveTo(x, y);
        ctx.lineTo(x + len, y);
        ctx.stroke();
      }

      // Rectangular armor plating grid (128x128 tiles)
      const tileSize = 128;
      for (let py = 0; py < 512; py += tileSize) {
        for (let px = 0; px < 512; px += tileSize) {
          // Plate bevel shadow
          ctx.strokeStyle = '#010206';
          ctx.lineWidth = 3;
          ctx.strokeRect(px + 1.5, py + 1.5, tileSize - 3, tileSize - 3);

          // Plate bevel highlight
          ctx.strokeStyle = '#1e293b';
          ctx.lineWidth = 1;
          ctx.strokeRect(px + 3, py + 3, tileSize - 6, tileSize - 6);

          // Chamfered corner cuts
          ctx.fillStyle = '#03060c';
          ctx.beginPath();
          ctx.moveTo(px, py + 14); ctx.lineTo(px + 14, py); ctx.lineTo(px, py); ctx.fill();
          ctx.beginPath();
          ctx.moveTo(px + tileSize, py + 14); ctx.lineTo(px + tileSize - 14, py); ctx.lineTo(px + tileSize, py); ctx.fill();

          // Hexagonal bolt rivets in corners
          const rivets = [
            [px + 18, py + 18],
            [px + tileSize - 18, py + 18],
            [px + 18, py + tileSize - 18],
            [px + tileSize - 18, py + tileSize - 18]
          ];
          rivets.forEach(([rx, ry]) => {
            ctx.fillStyle = '#010204';
            ctx.beginPath();
            ctx.arc(rx, ry, 3.5, 0, Math.PI * 2);
            ctx.fill();

            ctx.fillStyle = '#475569';
            ctx.beginPath();
            ctx.arc(rx - 0.5, ry - 0.5, 2, 0, Math.PI * 2);
            ctx.fill();

      tex.minFilter = THREE.LinearFilter;

    function createMachinedCoilTexture() {
      const c = document.createElement('canvas');
      c.width = 256; c.height = 256;
      const ctx = c.getContext('2d');
      ctx.fillStyle = '#040711';
      ctx.fillRect(0, 0, 256, 256);

      // Solenoid copper windings with ceramic insulation ribs
      for (let y = 0; y < 256; y += 8) {
        const grad = ctx.createLinearGradient(0, y, 0, y + 6);
        grad.addColorStop(0, '#78350f');
        grad.addColorStop(0.3, '#d97706');
        grad.addColorStop(0.5, '#fef3c7');
        grad.addColorStop(0.7, '#b45309');
        grad.addColorStop(1, '#451a03');
        ctx.fillStyle = grad;
        ctx.fillRect(0, y, 256, 6);

        ctx.fillStyle = '#0a0f1d';
        ctx.fillRect(0, y + 6, 256, 2);
      }

      // Vertical structural bracket clamps
      for (let x = 24; x < 256; x += 64) {
        ctx.fillStyle = '#010308';
        ctx.fillRect(x, 0, 12, 256);
        ctx.fillStyle = '#334155';
        ctx.fillRect(x + 2, 0, 8, 256);
        for (let by = 8; by < 256; by += 24) {
          ctx.fillStyle = '#080c16';
          ctx.beginPath();
          ctx.arc(x + 6, by, 2.5, 0, Math.PI * 2);
          ctx.fill();
        }
      }

      const tex = new THREE.CanvasTexture(c);
      tex.wrapS = THREE.RepeatWrapping;
      tex.wrapT = THREE.RepeatWrapping;
      tex.repeat.set(1, 4);
      tex.minFilter = THREE.LinearFilter;
      return tex;

    // Panoramic Atmospheric Curved Backdrop Helper (16:9 Mathematically Locked Widescreen Projection with Zero Stretch and Soft Feathers)
    function createCurvedBackdrop(tex, radius = 220, height = 260, yOffset = 4, opacity = 0.95) {
      // 135-degree cinematic arc wrapping smoothly behind stage
      const thetaLength = Math.PI * 0.85;
      const thetaStart = Math.PI - (thetaLength / 2);

      if (tex) {
        tex.wrapS = THREE.ClampToEdgeWrapping;
        tex.wrapT = THREE.ClampToEdgeWrapping;
        tex.repeat.set(1.0, 1.0);
        tex.minFilter = THREE.LinearMipmapLinearFilter;
        tex.magFilter = THREE.LinearFilter;
      }

      const geo = new THREE.CylinderGeometry(radius, radius, height, 64, 8, true, thetaStart, thetaLength);
      const pos = geo.attributes.position;
      const uvs = geo.attributes.uv;
      const count = pos.count;
      const colors = new Float32Array(count * 3);
      const halfH = height * 0.5;
      const aspect = 16.0 / 9.0;
      const imgWidth = height * aspect; // Physical width corresponding to exact 16:9 texture

      for (let i = 0; i < count; i++) {
        const x = pos.getX(i);
        const y = pos.getY(i);
        const z = pos.getZ(i);

        // Angle phi around Y axis from center (center is along -Z, x=0, z=-radius)
        const phi = Math.atan2(x, -z);
        const arcDist = phi * radius;

        // Exact 16:9 UV mapping centered at U = 0.5:
        const u = 0.5 + (arcDist / imgWidth);
        const normY = (y + halfH) / height; // 0 at bottom, 1 at top
        const v = normY;
        uvs.setXY(i, u, v);

        // Soft cosine vignette at outer horizontal edges & vertical extremities
        // Smoothly fade to black so there is ZERO harsh cylinder rim visible
        const vFade = Math.sin(normY * Math.PI); // 0 at top/bottom, 1 at center
        const vShade = Math.pow(Math.max(0.0, Math.min(1.0, vFade * 1.6)), 0.85);

        // Ground ambient occlusion to seamlessly merge with floor
        const floorShade = Math.min(1.0, 0.45 + Math.pow(normY, 0.7) * 0.55);

        // Horizontal feathering at edges of 16:9 frame
        const uDist = Math.abs(u - 0.5) * 2.0; // 0 at center, 1 at edge of 16:9 image
        const uFade = Math.max(0.0, Math.min(1.0, 1.0 - Math.pow(Math.max(0.0, (uDist - 0.72) / 0.28), 2.0)));

        const totalShade = vShade * floorShade * uFade;
        colors[i * 3] = totalShade;
        colors[i * 3 + 1] = totalShade;
        colors[i * 3 + 2] = totalShade;
      }
      uvs.needsUpdate = true;
      geo.setAttribute('color', new THREE.BufferAttribute(colors, 3));

      const mat = new THREE.MeshBasicMaterial({
        map: tex,
        vertexColors: true,
        side: THREE.BackSide,
        depthWrite: false,
        transparent: true,
        opacity: opacity,
        fog: false
      });
      const mesh = new THREE.Mesh(geo, mat);
      mesh.position.y = yOffset;
      mesh.userData = {
        baseOpacity: opacity,
        baseY: yOffset,
        baseRotY: 0,
        tex: tex
      };
      return mesh;
    }

        ud.tex.offset.y = Math.sin(t * 0.18) * 0.002 - subKick * 0.5;
        ud.tex.repeat.set(1.0 + subKick, 1.0 + subKick);
      }

      const ambientPulse = Math.sin(t * 0.35) * 0.02;
      const transientFlare = bands.transient * 0.04;
      const stormFlare = stormIntensity * 0.35;
      backdropMesh.material.opacity = Math.min(1.0, Math.max(0.2, ud.baseOpacity + ambientPulse + transientFlare + stormFlare));

    function createRadialSprite(r, g, b, innerAlpha, outerAlpha) {
      const c = document.createElement('canvas');

      const grad = ctx.createRadialGradient(32, 32, 0, 32, 32, 32);
      grad.addColorStop(0, `rgba(${r},${g},${b},${innerAlpha})`);
      grad.addColorStop(0.35, `rgba(${r},${g},${b},${innerAlpha * 0.75})`);
      grad.addColorStop(0.7, `rgba(${r},${g},${b},${innerAlpha * 0.25})`);
      grad.addColorStop(1, `rgba(${r},${g},${b},${outerAlpha})`);
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, 64, 64);
      const tex = new THREE.CanvasTexture(c);
      tex.minFilter = THREE.LinearFilter;
      return tex;

        return;

      const AudioCtxClass = window.AudioContext || window.webkitAudioContext;
      if (!AudioCtxClass) {

      if (!audioCtx) audioCtx = new AudioCtxClass();
      if (audioCtx.state === 'suspended') audioCtx.resume();

      if (navigator.mediaDevices && navigator.mediaDevices.getUserMedia) {
        navigator.mediaDevices.getUserMedia({ audio: true, video: false })

            micStream = stream;
            const source = audioCtx.createMediaStreamSource(stream);

            analyser.smoothingTimeConstant = 0.8;
            audioData = new Uint8Array(analyser.frequencyBinCount);

    // Process Audio Bands with Safe Fallback Clock
    function updateAudioBands() {
      const now = performance.now() * 0.001;
      if (analyser && audioData) {
        analyser.getByteFrequencyData(audioData);
        let subSum = 0, midBassSum = 0, midsSum = 0, highsSum = 0;
        for (let i = 1; i <= 6; i++) subSum += audioData[i];       // ~20 - 80 Hz
        for (let i = 7; i <= 20; i++) midBassSum += audioData[i];  // ~80 - 250 Hz
        for (let i = 21; i <= 150; i++) midsSum += audioData[i];   // ~250 - 2000 Hz
        for (let i = 151; i <= 600; i++) highsSum += audioData[i]; // ~2000 - 8000 Hz

        audioBands.sub = subSum / (6 * 255);
        audioBands.midBass = midBassSum / (14 * 255);
        audioBands.mids = midsSum / (130 * 255);
        audioBands.highs = highsSum / (450 * 255);
        audioBands.energy = (audioBands.sub * 1.5 + audioBands.midBass + audioBands.mids + audioBands.highs) * 0.25;

        if (audioBands.sub > 0.65 || audioBands.midBass > 0.70) {
          audioBands.transient = Math.min(1.0, audioBands.transient + 0.35);
        } else {
          audioBands.transient *= 0.85;
        }
      } else {
        const beatSec = 60.0 / (telemetry.bpm || 128.0);
        const phase = (now % beatSec) / beatSec;
        const beatPunch = Math.pow(Math.max(0, 1.0 - phase * 2.5), 2.5);
        audioBands.sub = 0.25 + beatPunch * 0.65;
        audioBands.midBass = 0.2 + beatPunch * 0.5;
        audioBands.mids = 0.2 + Math.sin(now * 3.0) * 0.15;
        audioBands.highs = 0.15 + Math.cos(now * 5.0) * 0.1;
        audioBands.energy = (audioBands.sub + audioBands.mids) * 0.5;
        audioBands.transient = beatPunch;
      }
    }

    let lastUserBlackoutTime = 0;
    let lastUserOverrideTime = 0;

    function pollTelemetry() {
      fetch('/api/decks')
        .then(r => r.json())
        .then(data => {
          if (data && data["1"]) {
            const d = data["1"];
            if (d.bpm) telemetry.bpm = parseFloat(d.bpm);
            if (d.key) telemetry.key = d.key;
            if (d.title) telemetry.title = d.title;
            if (d.artist) telemetry.artist = d.artist;
            document.getElementById('hud-telemetry').textContent = `${telemetry.bpm.toFixed(1)} BPM // ${telemetry.key} // ${telemetry.title}`;
          }
        }).catch(() => {});

      fetch('/api/vj/state')
        .then(r => r.json())
        .then(st => {
          if (st) {
            if (Date.now() - lastUserBlackoutTime > 2500 && st.blackout !== undefined) {
              isBlackout = !!st.blackout;
              const btnBlack = document.getElementById('btn-blackout');
              if (btnBlack) btnBlack.classList.toggle('active', isBlackout);
            }
            if (Date.now() - lastUserOverrideTime > 2500 && st.override !== undefined) {
              isOverride = st.override;
              document.getElementById('override-overlay').classList.toggle('active', isOverride);
            }
            if (st.last_event === 'storm' && (Date.now() / 1000 - st.strobe_time < 0.8)) {
              stormIntensity = 1.0;
            }
            if (st.scene) {
              if (lastSeenServerScene !== null && st.scene !== lastSeenServerScene) {
                const sIdx = parseInt(st.scene) - 1;
                if (sIdx >= 0 && sIdx < SCENES.length && sIdx !== activeSceneIdx) {
                  if (Date.now() - lastUserSceneSelectTime > 3000) {
                    switchScene(sIdx, false);
                  }
                }
              }
              lastSeenServerScene = st.scene;
            }
          }
        }).catch(() => {});
    }
    setInterval(pollTelemetry, 350);

        renderer.setSize(w, h);

        camera.aspect = w / h;
        camera.updateProjectionMatrix();

    let stageRainMesh = null;
    function initStageRain() {
      const rainCount = 3200;
      const rainGeo = new THREE.BufferGeometry();
      const positions = new Float32Array(rainCount * 3);
      const velocities = new Float32Array(rainCount);

      for (let i = 0; i < rainCount; i++) {
        positions[i * 3] = (Math.random() - 0.5) * 110;
        positions[i * 3 + 1] = Math.random() * 65 - 25;
        positions[i * 3 + 2] = (Math.random() - 0.5) * 90;
        velocities[i] = 1.4 + Math.random() * 1.6;
      }

      rainGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
      rainGeo.setAttribute('velocity', new THREE.BufferAttribute(velocities, 1));

      // Crisp elongated needle droplet texture
      const c = document.createElement('canvas');
      c.width = 16; c.height = 64;
      const ctx = c.getContext('2d');
      const grad = ctx.createLinearGradient(8, 0, 8, 64);
      grad.addColorStop(0, 'rgba(255,255,255,0)');
      grad.addColorStop(0.3, 'rgba(235,245,255,0.7)');
      grad.addColorStop(1, 'rgba(255,255,255,1.0)');
      ctx.fillStyle = grad;
      ctx.fillRect(6, 0, 4, 64);
      const rainTex = new THREE.CanvasTexture(c);

      const rainMat = new THREE.PointsMaterial({
        map: rainTex,
        color: 0xdbeafe,
        size: 1.2,
        transparent: true,
        opacity: 0.15,
        blending: THREE.AdditiveBlending,
        depthWrite: false
      });

      stageRainMesh = new THREE.Points(rainGeo, rainMat);
      scene.add(stageRainMesh);
    }

    function updateStageRain(dt, bands, stormIntensity) {
      if (!stageRainMesh) return;
      const pos = stageRainMesh.geometry.attributes.position.array;
      const vel = stageRainMesh.geometry.attributes.velocity.array;

      const speedMult = 1.0 + stormIntensity * 2.8 + bands.energy * 0.8;
      const windDrift = (0.28 + stormIntensity * 0.65);

      for (let i = 0; i < vel.length; i++) {
        pos[i * 3] += windDrift; // Wind slant
        pos[i * 3 + 1] -= vel[i] * speedMult; // Fall speed
        
        // Wrap boundaries
        if (pos[i * 3 + 1] < -25) {
          pos[i * 3 + 1] = 40;
          pos[i * 3] = (Math.random() - 0.5) * 110;
        }
        if (pos[i * 3] > 55) {
          pos[i * 3] = -55;
        }
      }

      stageRainMesh.geometry.attributes.position.needsUpdate = true;

      // Opacity escalates from gentle atmospheric mist to blinding torrential downpour
      const targetOpacity = Math.max(0.12, Math.min(0.95, stormIntensity * 1.4 + 0.12));
      stageRainMesh.material.opacity += (targetOpacity - stageRainMesh.material.opacity) * 0.15;
      stageRainMesh.material.size = stormIntensity > 0.05 ? 1.8 : 1.1;
    }

    function initThree() {
      try {
        renderer = new THREE.WebGLRenderer({ canvas: canvas, antialias: true, alpha: true, powerPreference: "high-performance" });

        }

      renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
      renderer.setSize(window.innerWidth || 1920, window.innerHeight || 1080);

      scene = new THREE.Scene();

      // Multi-Directional Cinematic Lighting (Deep shadows, high-contrast neon accents)
      ambLight = new THREE.AmbientLight(0x060b18, 0.38);
      scene.add(ambLight);

      dirLight1 = new THREE.DirectionalLight(0xffffff, 2.8); // Blinding Pure White Key
      dirLight1.position.set(30, 40, 30);

      dirLight2 = new THREE.DirectionalLight(0xff1122, 2.6); // Deep Laser Crimson Red Rim
      dirLight2.position.set(-30, -25, 25);

      const dirLight3 = new THREE.DirectionalLight(0x1d4ed8, 2.2); // Deep Royal Cobalt Blue Fill (No baby blue)

      // Post-Processing UnrealBloom

        composer = new THREE.EffectComposer(renderer);

      } catch (err) {
        console.warn("UnrealBloomPass fallback to standard WebGL:", err);

      // Initialize Procedural Textures & Meshes

    let stormLight = null;

    function initStormMesh() {
      const stormGeo = new THREE.BufferGeometry();
      const maxSegments = 160;
      const positions = new Float32Array(maxSegments * 2 * 3);
      const colors = new Float32Array(maxSegments * 2 * 3);
      
      for (let i = 0; i < maxSegments * 2; i++) {
        colors[i * 3] = 1.0;
        colors[i * 3 + 1] = 0.95;
        colors[i * 3 + 2] = 0.85; // Pure incandescent lightning core
      }
      stormGeo.setAttribute('position', new THREE.BufferAttribute(positions, 3));
      stormGeo.setAttribute('color', new THREE.BufferAttribute(colors, 3));

      const stormMat = new THREE.LineBasicMaterial({
        vertexColors: true,
        transparent: true,
        opacity: 0.0,
        blending: THREE.AdditiveBlending,
        depthWrite: false
      });
      stormLinesMesh = new THREE.LineSegments(stormGeo, stormMat);
      scene.add(stormLinesMesh);

      // Incandescent 360-degree lightning flash point light
      stormLight = new THREE.PointLight(0xffffff, 0.0, 160, 1.2);
      stormLight.position.set(0, 20, 0);
      scene.add(stormLight);
    }

    function generateStormLightning() {
      if (!stormLinesMesh) return;
      const posAttr = stormLinesMesh.geometry.attributes.position;
      const arr = posAttr.array;
      let ptr = 0;

      // 6 major lightning discharge trunks with branching sub-forks
      for (let b = 0; b < 6; b++) {
        let curX = (Math.random() - 0.5) * 50;
        let curY = 28.0;
        let curZ = (Math.random() - 0.5) * 40;

        for (let seg = 0; seg < 9; seg++) {
          arr[ptr++] = curX; arr[ptr++] = curY; arr[ptr++] = curZ;
          curX += (Math.random() - 0.5) * 9.0;
          curY -= Math.random() * 4.0 + 2.5;
          curZ += (Math.random() - 0.5) * 9.0;
          arr[ptr++] = curX; arr[ptr++] = curY; arr[ptr++] = curZ;

          // Fork branch
          if (seg === 4 && ptr < arr.length - 12) {
            let fX = curX, fY = curY, fZ = curZ;
            for (let f = 0; f < 2; f++) {
              arr[ptr++] = fX; arr[ptr++] = fY; arr[ptr++] = fZ;
              fX += (Math.random() - 0.5) * 11.0;
              fY -= 3.0;
              fZ += (Math.random() - 0.5) * 11.0;
              arr[ptr++] = fX; arr[ptr++] = fY; arr[ptr++] = fZ;
            }
          }
        }
      }
      posAttr.needsUpdate = true;
    }

    function triggerStormStrobeFlash() {
      const overlay = document.getElementById('storm-strobe-overlay');
      if (!overlay) return;

      // Multi-burst authentic stage lightning strobe sequence
      overlay.style.opacity = '0.95';
      setTimeout(() => { overlay.style.opacity = '0.15'; }, 60);
      setTimeout(() => { overlay.style.opacity = '0.85'; generateStormLightning(); }, 120);
      setTimeout(() => { overlay.style.opacity = '0.10'; }, 180);
      setTimeout(() => { overlay.style.opacity = '0.65'; }, 240);
      setTimeout(() => { overlay.style.opacity = '0.0'; }, 380);
    }

    function getCrowdTexture(type = 'a', repeatX = 1.0, offsetX = 0.0) {
      const loader = new THREE.TextureLoader();
      let src = '/vj_assets/crowd/concert_crowd_alpha.png';
      if (type === 'close') src = '/vj_assets/crowd/crowd_row1_close.png';
      else if (type === 'b') src = '/vj_assets/crowd/concert_crowd_b.png';
      else if (type === 'tiers') src = '/vj_assets/crowd/stadium_crowd_tiers.png';

      const tex = loader.load(src, (t) => {
        t.wrapS = THREE.RepeatWrapping;
        t.wrapT = THREE.ClampToEdgeWrapping;
        t.repeat.set(repeatX, 1.0);
        t.offset.set(offsetX, 0.0);
        t.generateMipmaps = true;
        t.minFilter = THREE.LinearMipmapLinearFilter;
        t.magFilter = THREE.LinearFilter;
        t.needsUpdate = true;
      });
      tex.wrapS = THREE.RepeatWrapping;
      tex.wrapT = THREE.ClampToEdgeWrapping;
      tex.repeat.set(repeatX, 1.0);
      tex.offset.set(offsetX, 0.0);
      return tex;
    }

    function getCrowdSilhouetteTexture() {

    // Robed Acolyte Silhouette Texture for Cathedral
    let acolyteTexCache = null;
    function getAcolyteSilhouetteTexture() {
      if (acolyteTexCache) return acolyteTexCache;
      const c = document.createElement('canvas');
      c.width = 256; c.height = 512;
      const ctx = c.getContext('2d');
      ctx.clearRect(0, 0, 256, 512);

      // Deep hooded robe silhouette with glowing golden ceremonial staff
      ctx.fillStyle = '#05070f';
      ctx.beginPath();
      // Hood
      ctx.arc(128, 80, 28, 0, Math.PI * 2);
      ctx.fill();
      // Sweeping robe
      ctx.beginPath();
      ctx.moveTo(128 - 26, 95);
      ctx.lineTo(128 - 60, 512);
      ctx.lineTo(128 + 60, 512);
      ctx.lineTo(128 + 26, 95);
      ctx.closePath();
      ctx.fill();

      // Ceremonial Staff
      ctx.strokeStyle = '#d97706';
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.moveTo(128 + 38, 512);
      ctx.lineTo(128 + 38, 45);
      ctx.stroke();

      // Glowing Staff Orb
      const grad = ctx.createRadialGradient(128 + 38, 45, 2, 128 + 38, 45, 22);
      grad.addColorStop(0, '#ffffff');
      grad.addColorStop(0.3, '#f59e0b');
      grad.addColorStop(1, 'transparent');
      ctx.fillStyle = grad;
      ctx.beginPath();
      ctx.arc(128 + 38, 45, 22, 0, Math.PI * 2);
      ctx.fill();

      acolyteTexCache = new THREE.CanvasTexture(c);
      return acolyteTexCache;
    }

    // =========================================================================
    function playPortalSound(isOpen) {
      if (!audioCtx || audioCtx.state !== 'running') return;
      try {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        const filter = audioCtx.createBiquadFilter();
        osc.type = isOpen ? 'sine' : 'sawtooth';
        filter.type = 'lowpass';
        const now = audioCtx.currentTime;
        if (isOpen) {
          osc.frequency.setValueAtTime(90, now);
          osc.frequency.exponentialRampToValueAtTime(360, now + 0.35);
          filter.frequency.setValueAtTime(300, now);
          filter.frequency.linearRampToValueAtTime(2400, now + 0.35);
          gain.gain.setValueAtTime(0.08, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.45);
        } else {
          osc.frequency.setValueAtTime(260, now);
          osc.frequency.exponentialRampToValueAtTime(50, now + 0.28);
          filter.frequency.setValueAtTime(1400, now);
          filter.frequency.linearRampToValueAtTime(150, now + 0.32);
          gain.gain.setValueAtTime(0.10, now);
          gain.gain.exponentialRampToValueAtTime(0.001, now + 0.4);
        }
        osc.connect(filter);
        filter.connect(gain);
        gain.connect(audioCtx.destination);
        osc.start(now);
        osc.stop(now + 0.46);
      } catch (e) {}
    }

    class PortalTransitionEngine {
      constructor() {
        this.camera = null;
        this.scene = null;
        this.group = new THREE.Group();
        this.isOpen = true;
        this.openProgress = 1.0;
        this.targetProgress = 1.0;
        this.style = 0; // 0: Blast Hatch, 1: Observation Shutter, 2: Quantum Iris
        this.autoTransition = true;
        this.enabled = true;
        this.isTransitioning = false;
        this.w = 4.0;
        this.h = 2.25;
        this.dist = 2.0;

        this.bezelGroup = new THREE.Group();
        this.hatchGroup = new THREE.Group();
        this.shutterGroup = new THREE.Group();
        this.irisGroup = new THREE.Group();
        this.shutterSlats = [];
        this.irisBlades = [];
        this.seamLaser = null;
        this.leftDoor = null;
        this.rightDoor = null;
        this.ledL = null;
        this.ledR = null;
      }

      init(cam, scn) {
        this.camera = cam;
        this.scene = scn;
        this.group.clear();
        this.group.position.set(0, 0, -this.dist);
        this.camera.add(this.group);
        if (!this.scene.children.includes(this.camera)) {
          this.scene.add(this.camera);
        }

        this.buildMaterials();
        this.buildBezel();
        this.buildHatch();
        this.buildShutter();
        this.buildIris();

        this.group.add(this.bezelGroup);
        this.group.add(this.hatchGroup);
        this.group.add(this.shutterGroup);
        this.group.add(this.irisGroup);

        this.updateDimensions();
        this.setStyle(0, false);
        this.setOpen(true, false);
      }

      buildMaterials() {
        const hc = document.createElement('canvas');
        hc.width = 256; hc.height = 64;
        const hctx = hc.getContext('2d');
        hctx.fillStyle = '#0f172a';
        hctx.fillRect(0, 0, 256, 64);
        hctx.fillStyle = '#f59e0b';
        for (let x = -64; x < 320; x += 32) {
          hctx.beginPath();
          hctx.moveTo(x, 0);
          hctx.lineTo(x + 16, 0);
          hctx.lineTo(x + 16 - 32, 64);
          hctx.lineTo(x - 32, 64);
          hctx.closePath();
          hctx.fill();
        }
        this.hazardTex = new THREE.CanvasTexture(hc);
        this.hazardTex.wrapS = THREE.RepeatWrapping;
        this.hazardTex.wrapT = THREE.RepeatWrapping;
        this.hazardTex.repeat.set(4.0, 1.0);

        this.bezelMat = new THREE.MeshStandardMaterial({
          color: 0x1e293b,
          metalness: 0.92,
          roughness: 0.28
        });

        this.hazardMat = new THREE.MeshBasicMaterial({
          map: this.hazardTex
        });

        this.doorMat = new THREE.MeshStandardMaterial({
          color: 0x0f172a,
          metalness: 0.88,
          roughness: 0.32,
          map: hullPanelsTex || null,
          bumpMap: hullPanelsTex || null,
          bumpScale: 0.15
        });

        this.ledMatGreen = new THREE.MeshBasicMaterial({ color: 0x10b981 });
        this.ledMatRed = new THREE.MeshBasicMaterial({ color: 0xef4444 });
        this.ledMatAmber = new THREE.MeshBasicMaterial({ color: 0xf59e0b });
      }

      updateDimensions() {
        if (!this.camera) return;
        const vFovRad = THREE.MathUtils.degToRad(this.camera.fov);
        this.h = 2.0 * this.dist * Math.tan(vFovRad * 0.5);
        this.w = this.h * (this.camera.aspect || (window.innerWidth / window.innerHeight));

        if (this.topBezel) {
          this.topBezel.scale.set(this.w + 0.4, 0.14, 0.08);
          this.topBezel.position.set(0, this.h * 0.5 + 0.05, 0);
          this.botBezel.scale.set(this.w + 0.4, 0.14, 0.08);
          this.botBezel.position.set(0, -this.h * 0.5 - 0.05, 0);
          this.leftBezel.scale.set(0.14, this.h + 0.4, 0.08);
          this.leftBezel.position.set(-this.w * 0.5 - 0.05, 0, 0);
          this.rightBezel.scale.set(0.14, this.h + 0.4, 0.08);
          this.rightBezel.position.set(this.w * 0.5 + 0.05, 0, 0);

          if (this.ledL) this.ledL.position.set(-this.w * 0.5 + 0.12, this.h * 0.5 - 0.1, 0.04);
          if (this.ledR) this.ledR.position.set(this.w * 0.5 - 0.12, this.h * 0.5 - 0.1, 0.04);
        }

        if (this.leftDoor && this.rightDoor) {
          const doorW = this.w * 0.58;
          const doorH = this.h * 1.12;
          this.leftDoor.scale.set(doorW, doorH, 0.06);
          this.rightDoor.scale.set(doorW, doorH, 0.06);
          if (this.seamLaser) {
            this.seamLaser.scale.set(0.02, doorH, 0.02);
          }
        }

        if (this.shutterSlats && this.shutterSlats.length > 0) {
          const slatH = (this.h * 1.05) / this.shutterSlats.length;
          this.shutterSlats.forEach((slat, idx) => {
            slat.scale.set(this.w * 1.05, slatH, 0.03);
            const y = (idx - (this.shutterSlats.length - 1) * 0.5) * slatH;
            slat.position.set(0, y, 0);
          });
        }

        if (this.irisBlades && this.irisBlades.length > 0) {
          const bladeR = Math.max(this.w, this.h) * 0.7;
          this.irisBlades.forEach((b) => {
            b.scale.set(bladeR, bladeR, 0.03);
          });
        }
      }

      buildBezel() {
        this.bezelGroup.clear();
        const boxGeo = new THREE.BoxGeometry(1, 1, 1);
        this.topBezel = new THREE.Mesh(boxGeo, this.hazardMat);
        this.botBezel = new THREE.Mesh(boxGeo, this.hazardMat);
        this.leftBezel = new THREE.Mesh(boxGeo, this.bezelMat);
        this.rightBezel = new THREE.Mesh(boxGeo, this.bezelMat);

        this.bezelGroup.add(this.topBezel);
        this.bezelGroup.add(this.botBezel);
        this.bezelGroup.add(this.leftBezel);
        this.bezelGroup.add(this.rightBezel);

        const ledGeo = new THREE.SphereGeometry(0.04, 12, 12);
        this.ledL = new THREE.Mesh(ledGeo, this.ledMatGreen);
        this.ledR = new THREE.Mesh(ledGeo, this.ledMatGreen);
        this.bezelGroup.add(this.ledL);
        this.bezelGroup.add(this.ledR);
      }

      buildHatch() {
        this.hatchGroup.clear();
        const boxGeo = new THREE.BoxGeometry(1, 1, 1);
        this.leftDoor = new THREE.Mesh(boxGeo, this.doorMat);
        this.rightDoor = new THREE.Mesh(boxGeo, this.doorMat);

        const seamGeo = new THREE.BoxGeometry(1, 1, 1);
        const seamMat = new THREE.MeshBasicMaterial({
          color: 0x00f0ff,
          transparent: true,
          opacity: 0.85
        });
        this.seamLaser = new THREE.Mesh(seamGeo, seamMat);

        this.hatchGroup.add(this.leftDoor);
        this.hatchGroup.add(this.rightDoor);
        this.hatchGroup.add(this.seamLaser);
      }

      buildShutter() {
        this.shutterGroup.clear();
        this.shutterSlats = [];
        const boxGeo = new THREE.BoxGeometry(1, 1, 1);
        for (let i = 0; i < 7; i++) {
          const slatMat = new THREE.MeshStandardMaterial({
            color: 0x1e293b,
            metalness: 0.95,
            roughness: 0.22,
            map: hullPanelsTex || null,
            transparent: true,
            opacity: 1.0
          });
          const slat = new THREE.Mesh(boxGeo, slatMat);
          this.shutterSlats.push(slat);
          this.shutterGroup.add(slat);
        }
      }

      buildIris() {
        this.irisGroup.clear();
        this.irisBlades = [];
        const bladeGeo = new THREE.RingGeometry(0.0, 1.0, 3, 1);
        const bladeMat = new THREE.MeshStandardMaterial({
          color: 0x0f172a,
          metalness: 0.9,
          roughness: 0.25,
          side: THREE.DoubleSide
        });
        const count = 8;
        for (let i = 0; i < count; i++) {
          const blade = new THREE.Mesh(bladeGeo, bladeMat);
          const angle = (i / count) * Math.PI * 2;
          blade.userData = { baseAngle: angle };
          this.irisBlades.push(blade);
          this.irisGroup.add(blade);
        }
      }

      setStyle(s, sync = true) {
        this.style = ((s % 3) + 3) % 3;
        this.hatchGroup.visible = (this.style === 0);
        this.shutterGroup.visible = (this.style === 1 && this.openProgress < 0.98);
        this.irisGroup.visible = (this.style === 2 && this.openProgress < 0.98);

        const names = ['Hatch', 'Shutter', 'Iris'];
        const btnStyle = document.getElementById('btn-portal-style');
        if (btnStyle) btnStyle.textContent = `⚙️ Style: ${names[this.style]}`;

        if (sync && window.syncChannel) {
          window.syncChannel.postMessage({ type: 'portalState', style: this.style });
        }
      }

      cycleStyle() {
        this.setStyle(this.style + 1, true);
      }

      setOpen(val, sync = true) {
        this.isOpen = !!val;
        this.targetProgress = this.isOpen ? 1.0 : 0.0;
        if (!this.isOpen) {
          if (this.style === 1) this.shutterGroup.visible = true;
          if (this.style === 2) this.irisGroup.visible = true;
        }
        playPortalSound(this.isOpen);
        this.updateHUDButton();

        if (sync && window.syncChannel) {
          window.syncChannel.postMessage({ type: 'portalState', open: this.isOpen });
        }
      }

      toggle() {
        this.setOpen(!this.isOpen, true);
      }

      setAuto(val, sync = true) {
        this.autoTransition = !!val;
        const btnAuto = document.getElementById('btn-portal-auto');
        if (btnAuto) {
          btnAuto.textContent = `⚡ Auto Portal: ${this.autoTransition ? 'ON' : 'OFF'}`;
          btnAuto.style.borderColor = this.autoTransition ? 'rgba(16, 185, 129, 0.7)' : 'rgba(255, 255, 255, 0.2)';
        }
        if (sync && window.syncChannel) {
          window.syncChannel.postMessage({ type: 'portalState', auto: this.autoTransition });
        }
      }

      toggleAuto() {
        this.setAuto(!this.autoTransition, true);
      }

      triggerSceneTransition(nextIdx, notifyServer = true) {
        if (this.isTransitioning) return;
        this.isTransitioning = true;
        this.updateHUDButton();

        // 1. Fully seal portal with ease-back
        this.setOpen(false, true);

        // 2. Poll until portal is 100% sealed at 0.0 before switching scenes
        let checkCount = 0;
        const checkTimer = setInterval(() => {
          checkCount++;
          if (this.openProgress <= 0.01 || checkCount > 35) {
            clearInterval(checkTimer);
            this.openProgress = 0.0;
            // Execute scene switch seamlessly in darkness behind sealed portal
            executeSceneSwitch(nextIdx, notifyServer);

            // Hold sealed for 200ms to allow new scene geometries and textures to settle
            setTimeout(() => {
              this.setOpen(true, true);
              this.isTransitioning = false;
              this.updateHUDButton();
            }, 200);
          }
        }, 25);
      }

      updateHUDButton() {
        const btn = document.getElementById('btn-portal-toggle');
        if (!btn) return;
        if (this.isTransitioning) {
          btn.textContent = '🚪 Portal: CYCLING...';
          btn.className = 'btn-action btn-portal cycling';
        } else if (this.isOpen) {
          btn.textContent = '🚪 Portal: OPEN';
          btn.className = 'btn-action btn-portal';
        } else {
          btn.textContent = '🚪 Portal: CLOSED';
          btn.className = 'btn-action btn-portal closed';
        }
      }

      update(dt, bands) {
        const speed = this.isTransitioning ? 3.6 : 2.5;
        const diff = this.targetProgress - this.openProgress;
        if (Math.abs(diff) < 0.005) {
          this.openProgress = this.targetProgress;
        } else {
          this.openProgress += Math.sign(diff) * Math.min(Math.abs(diff), dt * speed);
        }

        const isMoving = Math.abs(this.targetProgress - this.openProgress) > 0.01;
        const activeLedMat = isMoving ? this.ledMatAmber : (this.openProgress > 0.9 ? this.ledMatGreen : this.ledMatRed);
        if (this.ledL) this.ledL.material = activeLedMat;
        if (this.ledR) this.ledR.material = activeLedMat;

        // Style 0: Blast Hatch (Complete airtight closure with overlapping doors)
        if (this.style === 0 && this.leftDoor && this.rightDoor) {
          const slideDist = (this.w * 0.65) * this.openProgress;
          this.leftDoor.position.x = (-this.w * 0.25) - slideDist;
          this.rightDoor.position.x = (this.w * 0.25) + slideDist;
          if (this.seamLaser) {
            this.seamLaser.visible = (this.openProgress < 0.02);
            if (this.seamLaser.visible) {
              this.seamLaser.material.opacity = 0.6 + (bands.sub || 0.0) * 0.4;
            }
          }
        }

        // Style 1: Observation Shutter (Smooth rotation and complete zero-line fade out when opened)
        if (this.style === 1 && this.shutterSlats) {
          const rotX = (Math.PI * 0.5) * this.openProgress;
          const slatOpacity = this.openProgress > 0.65 ? Math.max(0.0, 1.0 - (this.openProgress - 0.65) / 0.3) : 1.0;
          this.shutterSlats.forEach(slat => {
            slat.rotation.x = rotX;
            slat.material.opacity = slatOpacity;
          });
          this.shutterGroup.visible = (this.openProgress < 0.98);
        }

        // Style 2: Quantum Iris (Retracts completely beyond screen bounds)
        if (this.style === 2 && this.irisBlades) {
          const maxDist = Math.max(this.w, this.h) * 0.85;
          const dist = maxDist * this.openProgress;
          this.irisBlades.forEach((blade) => {
            const angle = blade.userData.baseAngle + (this.openProgress * 0.45);
            blade.position.set(Math.cos(angle) * dist, Math.sin(angle) * dist, 0);
            blade.rotation.z = angle;
          });
          this.irisGroup.visible = (this.openProgress < 0.98);
        }
      }
    }

          this.coreOrb.rotation.y = t * 0.45;
          this.coreOrb.rotation.x = t * 0.25;
        }
        if (this.innerPoly) {
          this.innerPoly.rotation.x = -t * 0.6;
          this.innerPoly.rotation.y = t * 0.8;
          const iscale = 1.0 + bands.midBass * 0.5;
          this.innerPoly.scale.set(iscale, iscale, iscale);
        }
        if (this.rings.length > 0) {
          this.rings[0].rotation.z = t * 0.1 * (1.0 + bands.sub);
          if (this.rings[1]) this.rings[1].rotation.z = -t * 0.14;
        }
        this.solenoidBlocks.forEach((sb, idx) => {
          const s = 1.0 + Math.sin(t * 2.0 + idx * 0.4) * 0.08 * bands.sub;
          sb.scale.set(1.0, s, 1.0);
        });
        // Animate downward streams of dancing, fluttering photon particles
        if (this.laserStreamData) {
          const posArr = this.laserStreamData.geo.attributes.position.array;
          const { beamCount, ptsPerBeam } = this.laserStreamData;
          const speed = 1.4 + bands.transient * 1.6;

          for (let b = 0; b < beamCount; b++) {
            const bAngle = (b / beamCount) * Math.PI * 2 + Math.sin(t * 1.2 + b) * 0.06;
            const originX = Math.cos(bAngle) * 18.0;
            const originY = 15.0;
            const originZ = Math.sin(bAngle) * 18.0;
            const targetX = Math.cos(bAngle) * 6.5;
            const targetY = -4.0;
            const targetZ = Math.sin(bAngle) * 6.5;

            for (let p = 0; p < ptsPerBeam; p++) {
              const idx = (b * ptsPerBeam + p) * 3;
              const s = (p / ptsPerBeam + t * speed * 0.35) % 1.0;
              // Organic micro-fluttering displacement
              const flutterX = Math.sin(t * 15.0 + p * 0.8 + b) * (0.05 + s * 0.25);
              const flutterZ = Math.cos(t * 13.0 + p * 0.9 + b) * (0.05 + s * 0.25);

              posArr[idx] = originX + (targetX - originX) * s + flutterX;
              posArr[idx + 1] = originY + (targetY - originY) * s;
              posArr[idx + 2] = originZ + (targetZ - originZ) * s + flutterZ;
            }
          }
          this.laserStreamData.geo.attributes.position.needsUpdate = true;
          this.laserStreams.material.opacity = 0.65 + bands.highs * 0.35;
        }
        if (this.particles) {
          this.particles.rotation.y = t * 0.035;

        const scaleInner = 13.0 - Math.sin(cycle4D) * 4.5;

          [0,1],[1,2],[2,3],[3,0],

          [0,4],[1,5],[2,6],[3,7]

          alignCylinder(this.outerCubeEdges[idx], outerVerts[edge[0]], outerVerts[edge[1]]);

      setPreset(idx) {

      renderHoloCanvas() {
        if (!this.hCtx) return;
        const p = SHOWCASE_PRESETS[this.presetIdx];
        const ctx = this.hCtx;
        ctx.clearRect(0, 0, 1024, 512);

        // Hi-Tech Glassmorphism Hologram Base
        ctx.fillStyle = 'rgba(8, 14, 28, 0.92)';
        ctx.beginPath();
        if (ctx.roundRect) ctx.roundRect(16, 16, 992, 480, 24);
        else ctx.rect(16, 16, 992, 480);
        ctx.fill();
        ctx.strokeStyle = 'rgba(245, 158, 11, 0.8)';
        ctx.lineWidth = 5;
        ctx.stroke();

        // Inner glowing border accent
        ctx.strokeStyle = 'rgba(56, 189, 248, 0.35)';
        ctx.lineWidth = 2;
        ctx.strokeRect(28, 28, 968, 456);

        // Sol Roth Header & Preset Badge
        ctx.fillStyle = '#f59e0b';
        ctx.font = 'bold 36px "Space Grotesk", sans-serif';
        ctx.fillText(p.header, 52, 82);

          ctx.fillStyle = (i === this.presetIdx) ? '#f59e0b' : 'rgba(255,255,255,0.2)';
          ctx.beginPath();
          ctx.arc(890 + i * 22, 70, (i === this.presetIdx) ? 7 : 4, 0, Math.PI * 2);

        ctx.fillStyle = '#94a3b8';
        ctx.font = '600 20px monospace';
        ctx.fillText(p.subHeader, 52, 118);

        // Divider
        ctx.strokeStyle = 'rgba(255,255,255,0.18)';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.moveTo(52, 138); ctx.lineTo(972, 138);
        ctx.stroke();

        // Track / Release Title (Dynamic from live decks if in telemetry preset)
        let displayTitle = p.title;
        let displayMeta = p.meta;
        if (p.isLiveTelemetry && telemetry && telemetry.title) {

          displayMeta = `ARTIST: ${telemetry.artist ? telemetry.artist.toUpperCase() : 'SOL ROTH'} | BPM: ${telemetry.bpm.toFixed(1)} | KEY: ${telemetry.key}`;

        ctx.fillStyle = '#ffffff';
        ctx.font = 'bold 42px "Space Grotesk", sans-serif';
        ctx.fillText(displayTitle, 52, 202);

        ctx.font = 'bold 26px monospace';

      dispose() { scene.remove(this.group); }
