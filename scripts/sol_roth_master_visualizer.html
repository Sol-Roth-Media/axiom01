    SCENES.push(Scene13_AlbumShowcase);

    // -------------------------------------------------------------------------
    // SCENE 14: TITAN AWAKENING (2.5D Organic Cybernetic Climax Visualizer)
    // -------------------------------------------------------------------------
    const Scene14_TitanAwakening = {
      name: "Titan Awakening (2.5D Climax)",
      group: new THREE.Group(),
      mesh: null,
      bgMesh: null,
      stageFrameGroup: null,
      beamMeshes: [],
      material: null,
      uniforms: null,
      poses: [],
      currentPoseIdx: 0,
      targetPoseIdx: 0,
      morphProgress: 0.0,
      morphSpeed: 2.2,
      isMorphing: false,
      autoCycleInterval: null,
      autoCycleActive: true,
      lastHeadGaze: new THREE.Vector2(0, 0),

      init() {
        this.group.clear();
        this.beamMeshes = [];

        // 1. Textures & Depth Maps (Pristine robotic optics, zero cartoon pupils)
        const textureLoader = new THREE.TextureLoader();
        const setupTex = (t) => {
          t.generateMipmaps = true;
          t.minFilter = THREE.LinearMipmapLinearFilter;
          t.magFilter = THREE.LinearFilter;
        };

        const baseIdle = textureLoader.load('/vj_assets/titan_entity/anyma_idle_base.jpg', setupTex);
        const depthIdle = textureLoader.load('/vj_assets/titan_entity/anyma_idle_depth.jpg', setupTex);
        const baseFocus = textureLoader.load('/vj_assets/titan_entity/anyma_focus_base.jpg', setupTex);
        const depthFocus = textureLoader.load('/vj_assets/titan_entity/anyma_focus_depth.jpg', setupTex);
        const baseReach = textureLoader.load('/vj_assets/titan_entity/anyma_base.jpg', setupTex);
        const depthReach = textureLoader.load('/vj_assets/titan_entity/anyma_depth.jpg', setupTex);
        const baseAscend = textureLoader.load('/vj_assets/titan_entity/anyma_ascend_base.jpg', setupTex);
        const depthAscend = textureLoader.load('/vj_assets/titan_entity/anyma_ascend_depth.jpg', setupTex);

        this.poses = [
          { id: 0, name: 'IDLE', base: baseIdle, depth: depthIdle },
          { id: 1, name: 'FOCUS', base: baseFocus, depth: depthFocus },
          { id: 2, name: 'REACH', base: baseReach, depth: depthReach },
          { id: 3, name: 'ROAR', base: baseAscend, depth: depthAscend },
          { id: 4, name: 'GUARD', base: baseIdle, depth: depthFocus },
          { id: 5, name: 'ASCEND', base: baseAscend, depth: depthIdle }
        ];
        this.currentPoseIdx = 0;
        this.targetPoseIdx = 0;
        this.morphProgress = 0.0;
        this.isMorphing = false;

        // 2. Custom High-Precision Shaders
        this.uniforms = {
          uBaseMapA: { value: baseIdle },
          uBaseMapB: { value: baseIdle },
          uDepthMapA: { value: depthIdle },
          uDepthMapB: { value: depthIdle },
          uMorphProgress: { value: 0.0 },
          uHeadGaze: { value: new THREE.Vector2(0.0, 0.0) },
          uDisplacementScale: { value: 1.85 },
          uSubBass: { value: 0.0 },
          uKick: { value: 0.0 },
          uMids: { value: 0.0 },
          uHighs: { value: 0.0 },
          uTime: { value: 0.0 },
          uStageDim: { value: 1.0 },
          uStormFlash: { value: 0.0 },
          uThemeColor: { value: new THREE.Vector3(0.0, 0.94, 1.0) }
        };

        const vShader = `
          uniform sampler2D uDepthMapA;
          uniform sampler2D uDepthMapB;
          uniform float uMorphProgress;
          uniform float uDisplacementScale;
          uniform float uSubBass;
          uniform float uKick;
          uniform float uMids;
          uniform float uTime;
          uniform vec2 uHeadGaze;
          uniform float uStormFlash;

          varying vec2 vUv;
          varying vec3 vNormal;
          varying vec3 vWorldPosition;
          varying float vDepth;
          varying float vEdge;

          void main() {
            vUv = uv;
            float depthA = texture2D(uDepthMapA, uv).r;
            float depthB = texture2D(uDepthMapB, uv).r;
            float morphDepth = mix(depthA, depthB, uMorphProgress);
            vDepth = morphDepth;

            vec2 texel = vec2(1.0 / 384.0, 1.0 / 216.0);
            float dR = mix(texture2D(uDepthMapA, uv + vec2(texel.x, 0.0)).r, texture2D(uDepthMapB, uv + vec2(texel.x, 0.0)).r, uMorphProgress);
            float dL = mix(texture2D(uDepthMapA, uv - vec2(texel.x, 0.0)).r, texture2D(uDepthMapB, uv - vec2(texel.x, 0.0)).r, uMorphProgress);
            float dU = mix(texture2D(uDepthMapA, uv + vec2(0.0, texel.y)).r, texture2D(uDepthMapB, uv + vec2(0.0, texel.y)).r, uMorphProgress);
            float dD = mix(texture2D(uDepthMapA, uv - vec2(0.0, texel.y)).r, texture2D(uDepthMapB, uv - vec2(0.0, texel.y)).r, uMorphProgress);
            float edge = clamp(length(vec2(dR - dL, dU - dD)) * 3.0, 0.0, 1.0);
            vEdge = edge;

            float foregroundPop = pow(morphDepth, 1.35);
            float kickThrust = foregroundPop * (uKick * 1.1 + uSubBass * 0.5);
            float breath = sin(uTime * 1.8 + morphDepth * 3.14) * 0.035 * morphDepth;
            float microRipple = sin(uv.y * 22.0 + uTime * 5.0) * cos(uv.x * 18.0 + uTime * 3.5) * (uSubBass * 0.05 + uMids * 0.02) * morphDepth;

            vec3 newPosition = position;
            float headWeight = smoothstep(0.56, 0.74, uv.y) * smoothstep(0.30, 0.12, abs(uv.x - 0.5));
            newPosition.x += uHeadGaze.x * headWeight * 0.36;
            newPosition.y += uHeadGaze.y * headWeight * 0.20;
            newPosition.z += (uv.x - 0.5) * uHeadGaze.x * headWeight * 0.50;
            newPosition.z += (foregroundPop * uDisplacementScale) + kickThrust + breath + microRipple;

            if (uStormFlash > 0.05) {
              float jitter = sin(uTime * 45.0 + uv.y * 30.0) * uStormFlash * 0.04 * foregroundPop;
              newPosition.x += jitter;
              newPosition.z += jitter * 0.5;
            }

            vec2 centerOffset = uv - 0.5;
            newPosition.xy += centerOffset * (foregroundPop * uKick * 0.14);

            vec4 worldPos = modelMatrix * vec4(newPosition, 1.0);
            vWorldPosition = worldPos.xyz;
            vNormal = normalize(normalMatrix * normal);
            gl_Position = projectionMatrix * viewMatrix * worldPos;
          }
        `;

        const fShader = `
          uniform sampler2D uBaseMapA;
          uniform sampler2D uBaseMapB;
          uniform sampler2D uDepthMapA;
          uniform sampler2D uDepthMapB;
          uniform float uMorphProgress;
          uniform float uSubBass;
          uniform float uKick;
          uniform float uMids;
          uniform float uHighs;
          uniform float uTime;
          uniform float uStageDim;
          uniform float uStormFlash;
          uniform vec3 uThemeColor;

          varying vec2 vUv;
          varying vec3 vNormal;
          varying vec3 vWorldPosition;
          varying float vDepth;
          varying float vEdge;

          void main() {
            if (vEdge > 0.65) discard;

            float ca = uKick * 0.0020;
            vec2 dir = normalize(vUv - 0.5);

            vec3 colA = vec3(
              texture2D(uBaseMapA, vUv + dir * ca).r,
              texture2D(uBaseMapA, vUv).g,
              texture2D(uBaseMapA, vUv - dir * ca).b
            );
            vec3 colB = vec3(
              texture2D(uBaseMapB, vUv + dir * ca).r,
              texture2D(uBaseMapB, vUv).g,
              texture2D(uBaseMapB, vUv - dir * ca).b
            );
            vec3 baseColor = mix(colA, colB, uMorphProgress);

            vec3 viewDir = normalize(cameraPosition - vWorldPosition);

            // Controlled eye & circuit detail (Strictly clean metallic robotic optics, no cartoon pupils)
            float circuitLuminance = max(baseColor.g, baseColor.b) - baseColor.r;
            float circuitMask = smoothstep(0.20, 0.65, circuitLuminance);
            vec3 circuitGlow = uThemeColor * circuitMask * (uMids * 0.22 + 0.03);

            // Obsidian chrome rim lighting
            vec3 pseudoNormal = normalize(vec3((vUv.x - 0.5) * 0.7, (vUv.y - 0.5) * 0.7, 1.0 - vDepth * 0.7));
            float fresnel = pow(1.0 - max(dot(viewDir, pseudoNormal), 0.0), 3.5);
            vec3 chromeRim = uThemeColor * 0.35 * fresnel * (0.2 + uSubBass * 0.4);

            // Controlled specular reflection highlight
            vec3 lightDir = normalize(vec3(sin(uTime * 0.4) * 1.5, 2.0, 3.0));
            vec3 halfDir = normalize(lightDir + viewDir);
            float spec = pow(max(dot(pseudoNormal, halfDir), 0.0), 48.0);
            vec3 specularColor = uThemeColor * spec * (0.15 + uHighs * 0.35) * smoothstep(0.2, 0.85, vDepth);

            // Storm lightning flash
            vec3 lightning = vec3(0.92, 0.96, 1.0) * uStormFlash * (0.35 + vDepth * 0.65);

            vec3 rawColor = (baseColor * uStageDim) + (circuitGlow * uStageDim) + (specularColor * uStageDim) + (chromeRim * max(0.15, uStageDim)) + lightning;
            vec3 finalColor = rawColor / (vec3(1.0) + rawColor * 0.65);

            float vignette = 1.0 - smoothstep(0.48, 1.05, length(vUv - 0.5));
            finalColor *= mix(0.78, 1.0, vignette);

            gl_FragColor = vec4(finalColor, 1.0);
          }
        `;

        const geo = new THREE.PlaneGeometry(12.8, 7.2, 384, 216);
        this.material = new THREE.ShaderMaterial({
          uniforms: this.uniforms,
          vertexShader: vShader,
          fragmentShader: fShader,
          side: THREE.DoubleSide
        });

        this.mesh = new THREE.Mesh(geo, this.material);
        this.group.add(this.mesh);

        // Background Void Plate
        const bgGeo = new THREE.PlaneGeometry(12.8, 7.2);
        const bgMat = new THREE.MeshBasicMaterial({ map: baseIdle, depthWrite: false });
        this.bgMesh = new THREE.Mesh(bgGeo, bgMat);
        this.bgMesh.position.z = -0.2;
        this.group.add(this.bgMesh);

        // Reflective Wet Stage Floor (Deep Obsidian Black)
        const floorGeo = new THREE.PlaneGeometry(28, 18);
        floorGeo.rotateX(-Math.PI * 0.5);
        const floorMat = new THREE.MeshBasicMaterial({
          color: 0x020617,
          transparent: true,
          opacity: 0.85,
          depthWrite: false
        });
        this.floorMesh = new THREE.Mesh(floorGeo, floorMat);
        this.floorMesh.position.set(0, -3.7, 1);
        this.group.add(this.floorMesh);

        // Stage Frame & Corner Brackets
        this.stageFrameGroup = new THREE.Group();
        const fGeo = new THREE.BoxGeometry(13.0, 7.4, 0.15);
        const fEdges = new THREE.EdgesGeometry(fGeo);
        const fMat = new THREE.LineBasicMaterial({ color: 0x00f0ff, transparent: true, opacity: 0.75 });
        const frameLines = new THREE.LineSegments(fEdges, fMat);
        this.stageFrameGroup.add(frameLines);

        const cMat = new THREE.MeshBasicMaterial({ color: 0xffd700 });
        const cGeo = new THREE.BoxGeometry(0.8, 0.08, 0.16);
        [[-6.4, 3.6], [6.4, 3.6], [-6.4, -3.6], [6.4, -3.6]].forEach(pos => {
          const cb = new THREE.Mesh(cGeo, cMat);
          cb.position.set(pos[0], pos[1], 0.08);
          this.stageFrameGroup.add(cb);
        });
        this.group.add(this.stageFrameGroup);

        // Volumetric Concert Lightbeams
        const beamGeo = new THREE.CylinderGeometry(0.04, 0.75, 14.0, 16, 1, true);
        beamGeo.translate(0, 7.0, 0);
        beamGeo.rotateX(Math.PI * 0.5);

        for (let i = 0; i < 4; i++) {
          const bMat = new THREE.MeshBasicMaterial({
            color: 0x00f0ff,
            transparent: true,
            opacity: 0.08,
            blending: THREE.AdditiveBlending,
            side: THREE.DoubleSide,
            depthWrite: false
          });
          const bMesh = new THREE.Mesh(beamGeo, bMat);
          bMesh.position.set((i - 1.5) * 4.2, 4.8, -1.8);
          this.beamMeshes.push(bMesh);
          this.group.add(bMesh);
        }

        // Automatic Pose Cycling (Slow 30s cycle, strictly alternating between IDLE & FOCUS; NEVER auto-reach)
        if (this.autoCycleInterval) clearInterval(this.autoCycleInterval);
        this.autoCycleInterval = setInterval(() => {
          if (this.autoCycleActive !== true) return;
          // Strictly alternate subtle resting poses: 0 (IDLE) and 1 (FOCUS).
          // REACH (2) and ROAR (3) are strictly manual / DJ action buttons!
          const subtlePoses = [0, 1, 4];
          const curSubtleIdx = subtlePoses.indexOf(this.currentPoseIdx);
          const next = subtlePoses[(curSubtleIdx + 1) % subtlePoses.length];
          this.triggerPose(next);
          if (typeof updateCharacterControlButtons === 'function') {
            updateCharacterControlButtons();
          }
        }, 30000);

        scene.add(this.group);
      },

      triggerPose(idx) {
        if (!this.poses || !this.poses[idx]) return;
        if (idx === this.currentPoseIdx && !this.isMorphing) return;
        this.targetPoseIdx = idx;
        this.uniforms.uBaseMapA.value = this.poses[this.currentPoseIdx].base;
        this.uniforms.uDepthMapA.value = this.poses[this.currentPoseIdx].depth;
        this.uniforms.uBaseMapB.value = this.poses[this.targetPoseIdx].base;
        this.uniforms.uDepthMapB.value = this.poses[this.targetPoseIdx].depth;
        this.morphProgress = 0.0;
        this.isMorphing = true;
        if (window.syncChannel) {
          window.syncChannel.postMessage({ type: 'setPose', idx: idx });
        }
      },

      update(t, bands) {
        if (!this.uniforms) return;

        // Smooth pose morphing
        if (this.isMorphing) {
          this.morphProgress += 0.016 * this.morphSpeed;
          if (this.morphProgress >= 1.0) {
            this.morphProgress = 1.0;
            this.isMorphing = false;
            this.currentPoseIdx = this.targetPoseIdx;
            this.uniforms.uBaseMapA.value = this.poses[this.currentPoseIdx].base;
            this.uniforms.uDepthMapA.value = this.poses[this.currentPoseIdx].depth;
            if (typeof updateCharacterControlButtons === 'function') {
              updateCharacterControlButtons();
            }
          }
          this.uniforms.uMorphProgress.value = this.morphProgress;
        }

        // Audio reactivity
        this.uniforms.uTime.value = t;
        this.uniforms.uSubBass.value = bands.sub || 0.0;
        this.uniforms.uKick.value = bands.kick || 0.0;
        this.uniforms.uMids.value = bands.mids || 0.0;
        this.uniforms.uHighs.value = bands.highs || 0.0;
        this.uniforms.uStageDim.value = isBlackout ? 0.05 : 1.0;
        this.uniforms.uStormFlash.value = stormIntensity;

        // Theme colors matching global colorShiftMode
        const themeColors = [
          new THREE.Vector3(0.0, 0.94, 1.0),  // Normal (Cyan)
          new THREE.Vector3(1.0, 0.15, 0.25), // Crimson
          new THREE.Vector3(0.96, 0.62, 0.07),// Solar Gold
          new THREE.Vector3(0.68, 0.25, 0.98) // Cyber Violet
        ];
        this.uniforms.uThemeColor.value.copy(themeColors[colorShiftMode] || themeColors[0]);

        // Organic head gaze tracking
        const targetGazeX = Math.sin(t * 0.45) * 0.45;
        const targetGazeY = Math.cos(t * 0.35) * 0.25;
        this.lastHeadGaze.x += (targetGazeX - this.lastHeadGaze.x) * 0.05;
        this.lastHeadGaze.y += (targetGazeY - this.lastHeadGaze.y) * 0.05;
        this.uniforms.uHeadGaze.value.copy(this.lastHeadGaze);

        // Volumetric Concert Beams animation
        this.beamMeshes.forEach((b, idx) => {

    let autoFlowMode = 0; // 0 = OFF, 1 = 60s, 2 = 120s, 3 = 180s, 4 = 300s
    const AUTO_FLOW_TIMES = [0, 60, 120, 180, 300];
    const AUTO_FLOW_LABELS = ['OFF', '1m', '2m', '3m', '5m'];
    let autoFlowRemaining = 0;

    function toggleAutoFlow() {
      autoFlowMode = (autoFlowMode + 1) % AUTO_FLOW_TIMES.length;
      autoFlowRemaining = AUTO_FLOW_TIMES[autoFlowMode];
      updateAutoFlowButton();
      if (window.syncChannel) {
        window.syncChannel.postMessage({ type: 'setAutoFlow', mode: autoFlowMode });
      }
    }

    function updateAutoFlowButton() {
      const btn = document.getElementById('btn-autoflow');
      if (!btn) return;
      if (autoFlowMode === 0) {
        btn.textContent = '⏱️ Flow: OFF';
        btn.classList.remove('active');
      } else {
        const mins = Math.floor(autoFlowRemaining / 60);
        const secs = Math.floor(autoFlowRemaining % 60).toString().padStart(2, '0');
        btn.textContent = `⏱️ Flow: ${AUTO_FLOW_LABELS[autoFlowMode]} (${mins}:${secs})`;
        btn.classList.add('active');
      }
    }

    function updateAutoFlowTimer(dt) {
      if (autoFlowMode === 0) return;
      autoFlowRemaining -= dt;
      if (autoFlowRemaining <= 0) {
        const nextIdx = (activeSceneIdx + 1) % SCENES.length;
        switchScene(nextIdx, true);
        autoFlowRemaining = AUTO_FLOW_TIMES[autoFlowMode];
      }
      updateAutoFlowButton();
    }

    function cycleStorySet() {
      const nextIdx = (currentStoryIdx + 1) % STORY_SETS.length;
      setStorySet(nextIdx, true);
    }

    function setStorySet(storyIdx, notify = true) {
      if (storyIdx < 0 || storyIdx >= STORY_SETS.length) return;
      if (activeSceneIdx >= 0 && SCENES[activeSceneIdx]) {
        SCENES[activeSceneIdx].dispose();
      }
      currentStoryIdx = storyIdx;
      SCENES = STORY_SETS[currentStoryIdx].scenes;
      activeSceneIdx = -1;

      const btnStory = document.getElementById('btn-story-select');
      if (btnStory) {
        btnStory.textContent = `📚 Story: ${STORY_SETS[currentStoryIdx].shortTitle}`;
      }

      renderSceneButtons();
      switchScene(0, notify);

      if (window.syncChannel) {
        window.syncChannel.postMessage({ type: 'setStory', storyIdx: storyIdx });
      }
    }

    function renderSceneButtons() {
      const container = document.querySelector('.hud-tier-scenes');
      if (!container) return;
      container.innerHTML = '';
      SCENES.forEach((sc, idx) => {
        const btn = document.createElement('button');
        btn.className = `btn-scene ${idx === activeSceneIdx ? 'active' : ''}`;
        btn.textContent = `${idx + 1}. ${sc.shortName || sc.name.split(' ')[0]}`;
        btn.onclick = () => switchScene(idx);
        container.appendChild(btn);
      });
    }

    function executeSceneSwitch(idx, notifyServer = true) {
      if (idx < 0 || idx >= SCENES.length) return;
      if (activeSceneIdx >= 0 && SCENES[activeSceneIdx]) {
        SCENES[activeSceneIdx].dispose();
      }
      activeSceneIdx = idx;
      const currentScene = SCENES[activeSceneIdx];
      currentScene.init();

      // Standardized Context Action Buttons Visibility
      const btnMecha = document.getElementById('btn-mechamode');
      if (btnMecha) btnMecha.style.display = (currentScene.id === 'mecha_gantry' || currentScene.id === 'titan_hangar') ? 'inline-block' : 'none';
      const btnHyper = document.getElementById('btn-hyperdrive');
      if (btnHyper) btnHyper.style.display = (currentScene.id === 'warp_tunnel') ? 'inline-block' : 'none';

      // Standardized Focal Framing tailored to each scene (Immediate snap to perfect framing, no starting at 58.0!)
      targetCamDist = currentScene.targetCamDist || 28.0;
      camDist = targetCamDist;
      camAngle = 0.0;
      targetCamRoll = 0.0;
      camRollAngle = 0.0;
      camera.up.set(0, 1, 0);

      const baseY = (currentScene.camTargetY !== undefined) ? currentScene.camTargetY : 1.2;
      const lookY = (currentScene.lookAtY !== undefined) ? currentScene.lookAtY : 0.8;
      
      camera.position.set(0, baseY, camDist);
      camera.lookAt(0, lookY, 0);
      if (controls) {
        controls.target.set(0, lookY, 0);
        if (currentScene.hasCharacter) {
          controls.maxAzimuthAngle = Math.PI * 0.32;
          controls.minAzimuthAngle = -Math.PI * 0.32;
          controls.maxPolarAngle = Math.PI * 0.52;
        } else {
          controls.maxAzimuthAngle = Infinity;
          controls.minAzimuthAngle = -Infinity;
          controls.maxPolarAngle = Math.PI * 0.58;
        }
        controls.update();
      }

      // Update Character Action Buttons (Enabled on character scenes, disabled on non-character scenes)
      updateCharacterControlButtons();

      // Reset auto-flow timer so user gets full duration
      if (autoFlowMode > 0) {
        autoFlowRemaining = AUTO_FLOW_TIMES[autoFlowMode];
      }

      document.querySelectorAll('.btn-scene').forEach((btn, i) => {
        btn.classList.toggle('active', i === idx);
      });
      console.log(`✓ Switched to Scene ${idx + 1}: ${currentScene.name}`);

      if (window.syncChannel) {
        window.syncChannel.postMessage({ type: 'switchScene', idx: idx });
      }

      if (notifyServer) {
        lastUserSceneSelectTime = Date.now();
        fetch(`/api/vj/trigger?scene=${idx + 1}`).catch(() => {});
      }
    }

    function switchScene(idx, notifyServer = true) {
      if (idx < 0 || idx >= SCENES.length) return;
      if (idx === activeSceneIdx) return;

      if (portalTransitionSystem && portalTransitionSystem.autoTransition && portalTransitionSystem.enabled) {
        portalTransitionSystem.triggerSceneTransition(idx, notifyServer);
      } else {
        executeSceneSwitch(idx, notifyServer);
      }
    }

    function resetSceneCamera() {
      lastUserInteractTime = 0;
      const currentScene = SCENES[activeSceneIdx];
      if (!currentScene) return;
      targetCamDist = currentScene.targetCamDist || 28.0;
      camDist = targetCamDist;
      camAngle = 0.0;
      targetCamRoll = 0.0;
      camRollAngle = 0.0;
      camera.up.set(0, 1, 0);
      const baseY = (currentScene.camTargetY !== undefined) ? currentScene.camTargetY : 1.2;
      const lookY = (currentScene.lookAtY !== undefined) ? currentScene.lookAtY : 0.8;
      if (controls) {
        controls.target.set(0, lookY, 0);
        controls.update();
      }
      camera.position.set(0, baseY, camDist);
      camera.lookAt(0, lookY, 0);
      if (window.syncChannel) {
        window.syncChannel.postMessage({ type: 'resetCam' });
      }
      console.log("🎯 Camera reset to default framing for", currentScene.name);
    }

    function updateCharacterControlButtons() {
      const currentScene = SCENES[activeSceneIdx];
      const hasChar = !!(currentScene && typeof currentScene.triggerPose === 'function');
      
      const charBtns = document.querySelectorAll('.btn-char-ctrl');
      charBtns.forEach(btn => {
        btn.disabled = !hasChar;
        btn.classList.toggle('disabled', !hasChar);
      });

      if (hasChar) {
        const pBtn = document.getElementById('btn-char-pose');
        const activeIdx = (currentScene.targetPoseIdx !== undefined && currentScene.isMorphing) ? currentScene.targetPoseIdx : (currentScene.currentPoseIdx || 0);
        if (pBtn && currentScene.poses && currentScene.poses[activeIdx]) {
          const pName = currentScene.poses[activeIdx].name;
          pBtn.textContent = `🧍 Pose: ${pName}`;
        }
        const autoBtn = document.getElementById('btn-char-autopose');
        if (autoBtn) {
          const isAuto = (currentScene.autoCycleActive === true);
          autoBtn.textContent = isAuto ? '🤖 Auto Pose: ON' : '🤖 Auto Pose: OFF';
          autoBtn.classList.toggle('active', isAuto);
        }
      }
    }

    function triggerScenePose(targetIdx = null) {
      const currentScene = SCENES[activeSceneIdx];
      if (!currentScene || typeof currentScene.triggerPose !== 'function') return;
      // Manual selection disengages auto-cycle to hold chosen pose indefinitely
      currentScene.autoCycleActive = false;
      const activeIdx = (currentScene.targetPoseIdx !== undefined && currentScene.isMorphing) ? currentScene.targetPoseIdx : (currentScene.currentPoseIdx || 0);
      if (targetIdx === null) {
        targetIdx = (activeIdx + 1) % (currentScene.poses ? currentScene.poses.length : 4);
      }
      currentScene.triggerPose(targetIdx);
      updateCharacterControlButtons();
      console.log("🧍 Manual Pose selected:", targetIdx, currentScene.poses ? currentScene.poses[targetIdx].name : "");
    }

    function triggerSceneReach() {
      const currentScene = SCENES[activeSceneIdx];
      if (!currentScene || typeof currentScene.triggerPose !== 'function') return;
      currentScene.autoCycleActive = false; // Hold manual action
      currentScene.triggerPose(2); // REACH
      updateCharacterControlButtons();
      console.log("🖐️ Manual REACH triggered");
    }

    function triggerSceneRoar() {
      const currentScene = SCENES[activeSceneIdx];
      if (!currentScene || typeof currentScene.triggerPose !== 'function') return;
      currentScene.autoCycleActive = false; // Hold manual action
      currentScene.triggerPose(3); // ASCEND / ROAR
      updateCharacterControlButtons();
      console.log("⚡ Manual ROAR triggered");
    }

    function toggleAutoPose() {
      const currentScene = SCENES[activeSceneIdx];
      if (!currentScene) return;
      currentScene.autoCycleActive = (currentScene.autoCycleActive !== true);
      updateCharacterControlButtons();
      console.log("🤖 Auto Pose set to:", currentScene.autoCycleActive);
    }

    function toggleBillboard(force) {
      if (force !== undefined) isBillboardActive = force;
      else isBillboardActive = !isBillboardActive;
      const bb = document.getElementById('brand-billboard');
      if (bb) bb.classList.toggle('active', isBillboardActive);
      const btn = document.getElementById('btn-announce');
      if (btn) btn.classList.toggle('active', isBillboardActive);
      if (isBillboardActive) updateBillboardUI();
    }

    function setBillboardPreset(idx) {
      billboardPresetIdx = (idx + BILLBOARD_PRESETS.length) % BILLBOARD_PRESETS.length;
      updateBillboardUI();
    }

    function cycleBillboardPreset(delta) {
      setBillboardPreset(billboardPresetIdx + delta);
    }

    function updateBillboardUI() {
      const p = BILLBOARD_PRESETS[billboardPresetIdx];
      const badge = document.getElementById('bb-badge');
      const img = document.getElementById('bb-image');
      const title = document.getElementById('bb-title');
      const desc = document.getElementById('bb-desc');
      if (badge) badge.textContent = p.badge;
      if (img) img.src = p.img;
      if (title) title.textContent = p.title;
      if (desc) desc.textContent = p.desc;

      const dots = document.querySelectorAll('.billboard-dot');
      dots.forEach((d, i) => d.classList.toggle('active', i === billboardPresetIdx));
    }

    function toggleCamSpeed() {
      camSpeedMode = (camSpeedMode + 1) % CAM_SPEED_NAMES.length;
      const btn = document.getElementById('btn-camspeed');
      if (btn) btn.textContent = `⏱️ Cam: ${CAM_SPEED_NAMES[camSpeedMode]}`;
      if (CAM_SPEED_MULT[camSpeedMode] === 0) {
        resetSceneCamera();
      }
    }

    function triggerEvent(name, notifyServer = true) {
      if (window.syncChannel) {
        window.syncChannel.postMessage({ type: 'triggerEvent', name: name });
      }
      if (name === 'storm') {
        stormIntensity = 1.0;
        camShudder = 1.0;
        generateStormLightning();
        triggerStormStrobeFlash();
        if (notifyServer) fetch('/api/vj/trigger?event=storm').catch(() => {});
      } else if (name === 'flip') {
        isFlipped = !isFlipped;
        targetCamRoll = isFlipped ? Math.PI : 0.0;
        targetCamUpY = isFlipped ? -1.0 : 1.0;
        const btnFlip = document.getElementById('btn-flip');
        if (btnFlip) btnFlip.classList.toggle('active', isFlipped);
        if (notifyServer) fetch('/api/vj/trigger?event=flip').catch(() => {});
      } else if (name === 'colorshift') {
        colorShiftMode = (colorShiftMode + 1) % 4;
        const btnCol = document.getElementById('btn-color');
        if (btnCol) btnCol.textContent = `🎨 Color: ${COLOR_SHIFT_NAMES[colorShiftMode]}`;
        
        // Update Color Grade Lighting Gel Overlay
        const colOverlay = document.getElementById('color-grade-overlay');
        if (colOverlay) {
          colOverlay.className = colorShiftMode > 0 ? `mode-${colorShiftMode}` : '';
        }
        if (notifyServer) fetch('/api/vj/trigger?event=colorshift').catch(() => {});
      } else if (name === 'announce') {
        toggleBillboard();
        if (notifyServer) fetch('/api/vj/trigger?event=announce').catch(() => {});
      } else if (name === 'blackout') {
        isBlackout = !isBlackout;
        lastUserBlackoutTime = Date.now();
        const btnBlack = document.getElementById('btn-blackout');
        if (btnBlack) btnBlack.classList.toggle('active', isBlackout);
        if (notifyServer) fetch('/api/vj/trigger?event=blackout').catch(() => {});
      } else if (name === 'override') {
        isOverride = !isOverride;
        lastUserOverrideTime = Date.now();
        document.getElementById('override-overlay').classList.toggle('active', isOverride);
        if (notifyServer) fetch('/api/vj/trigger?event=override').catch(() => {});
      } else if (name === 'zoom') {
        isZoomed = !isZoomed;
        targetCamDist = isZoomed ? 14.0 : 32.0;
        if (notifyServer) fetch('/api/vj/trigger?event=zoom').catch(() => {});
      } else if (name === 'hyperdrive') {
        if (Scene4_WarpTunnel && typeof Scene4_WarpTunnel.triggerHyperdrive === 'function') {
          Scene4_WarpTunnel.triggerHyperdrive();
        }
      }
    }

    // Keyboard Shortcuts (1-9, 0=10, -=11, ==12, [=13, ]=14, H=Stage Mode)
    window.addEventListener('keydown', e => {
      if (e.key >= '1' && e.key <= '9') switchScene(parseInt(e.key) - 1);
      else if (e.key === '0') switchScene(9);
      else if (e.key === '-' || e.key === '_') switchScene(10);
      else if (e.key === '=' || e.key === '+') switchScene(11);
      else if (e.key === '[' || e.key === '{') switchScene(12);
      else if (e.key === ']' || e.key === '}') switchScene(13);
      else if (e.key.toLowerCase() === 'p') triggerScenePose();
      else if (e.key.toLowerCase() === 'k') triggerSceneReach();
      else if (e.key.toLowerCase() === 'l') triggerSceneRoar();
      else if (e.key.toLowerCase() === 'r') resetSceneCamera();
      else if (e.key.toLowerCase() === 't') cycleStorySet();
      else if (e.key.toLowerCase() === 's') triggerEvent('storm');
      else if (e.key.toLowerCase() === 'v') triggerEvent('flip');
      else if (e.key.toLowerCase() === 'c') triggerEvent('colorshift');
      else if (e.key.toLowerCase() === 'a') triggerEvent('announce');
      else if (e.key.toLowerCase() === 'b') triggerEvent('blackout');
      else if (e.key.toLowerCase() === 'o') triggerEvent('override');
      else if (e.key.toLowerCase() === 'z') triggerEvent('zoom');
      else if (e.key.toLowerCase() === 'w' || e.code === 'Space') triggerEvent('hyperdrive');
      else if (e.key.toLowerCase() === 'm') toggleMechaMode();
      else if (e.key.toLowerCase() === 'g') togglePortal();
      else if (e.key.toLowerCase() === 'j') cyclePortalStyle();
      else if (e.key.toLowerCase() === 'y') toggleAutoPortal();
      else if (e.key.toLowerCase() === 'p') {
        if (Scene13_AlbumShowcase && activeSceneIdx === 12) {
          Scene13_AlbumShowcase.cyclePreset(1);
        }
      }
      else if (e.key.toLowerCase() === 'f') toggleFullscreen();
      else if (e.key.toLowerCase() === 'h') {
        document.body.classList.toggle('stage-mode');
      }
    });

    // =========================================================================
    // NATIVE WEB MIDI HARDWARE CONTROLLER BRIDGE (Pioneer DDJ-FLX10, Pads, Keys)
    // =========================================================================
    let visMidiAccess = null;
    let connectedMidiDeviceName = '';

    if (navigator.requestMIDIAccess) {
      navigator.requestMIDIAccess({ sysex: false }).then(access => {
        visMidiAccess = access;
        setupVisualizerMIDI();
        access.onstatechange = (e) => {
          setupVisualizerMIDI();
        };
      }).catch(err => {
        console.log('Visualizer Web MIDI not available:', err);
      });
    }

    function setupVisualizerMIDI() {
      if (!visMidiAccess) return;
      let hasDevice = false;
      for (let input of visMidiAccess.inputs.values()) {
        hasDevice = true;
        connectedMidiDeviceName = input.name || 'MIDI Controller';
        input.onmidimessage = handleVisualizerMIDIMessage;
      }
      const midiPill = document.getElementById('vis-midi-pill');
      if (midiPill) {
        if (hasDevice) {
          midiPill.style.display = 'inline-flex';
          midiPill.textContent = `🎹 MIDI: ${connectedMidiDeviceName.substring(0, 10)}`;
        } else {
          midiPill.style.display = 'none';
        }
      }
    }

    function handleVisualizerMIDIMessage(event) {
      const [status, data1, data2] = event.data;
      const cmd = status >> 4;
      const velocity = data2;

      // Note On: Physical hardware trigger (Pioneer DDJ-FLX10 Pads, Roland, Alesis)
      if (cmd === 9 && velocity > 0) {
        const note = data1;

        // Pads 1 - 8 (Scenes 0 to 7)
        if (note >= 36 && note <= 43) {
          switchScene(note - 36);
        } else if (note >= 60 && note <= 67) {
          switchScene(note - 60);
        }
        // Story Arc Cycle (Note 48)
        else if (note === 48 || note === 72) {
          cycleStorySet();
        }
        // Character Poses (Notes 49, 50, 51)
        else if (note === 49) triggerScenePose();
        else if (note === 50) triggerSceneReach();
        else if (note === 51) triggerSceneRoar();
        // Portal Controls (Notes 52, 53)
        else if (note === 52) togglePortal();
        else if (note === 53) cyclePortalStyle();
        // Stage Events & Visual Effects (Notes 54-59)
        else if (note === 54) triggerEvent('storm');
        else if (note === 55) triggerEvent('flip');
        else if (note === 56) triggerEvent('colorshift');
        else if (note === 57) triggerEvent('blackout');
        else if (note === 58) triggerEvent('announce');
        else if (note === 59) triggerEvent('hyperdrive');
      }
      // Control Change (Knobs, Faders, Mod Wheel)
      else if (cmd === 11) {
        const cc = data1;
        const val = data2 / 127;
        if (cc === 1) { // Modulation Wheel: Dynamic Camera Sway / Zoom
          targetCamDist = 2.0 + (1.0 - val) * 6.0;
        } else if (cc === 7 || cc === 11) { // Expression / Volume: Portal Aperture
          if (portalTransitionSystem && typeof portalTransitionSystem.setManualAperture === 'function') {
            portalTransitionSystem.setManualAperture(val);
          }
        }
      }
    }

    function toggleFullscreen() {
      if (!document.fullscreenElement) {
        document.documentElement.requestFullscreen().catch(() => {});
      } else {
        document.exitFullscreen().catch(() => {});
      }
    }

    function drawSpectrumMonitor() {
      const sCanvas = document.getElementById('spectrum-canvas');
      const sCtx = sCanvas.getContext('2d');
      sCtx.clearRect(0, 0, sCanvas.width, sCanvas.height);

      const bandsArr = [audioBands.sub, audioBands.midBass, audioBands.mids, audioBands.highs];
      const colors = ['#ef4444', '#f59e0b', '#10b981', '#00f0ff'];
      const barWidth = 30;
      bandsArr.forEach((val, i) => {
        sCtx.fillStyle = colors[i];
        const h = Math.min(val * 30, 30);
        sCtx.fillRect(6 + i * 36, 32 - h, barWidth, h);
      });
    }

    // =========================================================================
    // 5. MAIN ANIMATION LOOP (LOCKED 60 FPS)
    // =========================================================================
    function animate() {
      requestAnimationFrame(animate);

      const now = performance.now();
      const dt = 0.016;
      const t = now * 0.001;

      frameCount++;
      if (now - lastFrameTime >= 1000) {
        currentFps = frameCount;
        frameCount = 0;
        lastFrameTime = now;
        document.getElementById('fps-counter').textContent = `${currentFps} FPS`;
      }

      updateAudioBands();
      updateCyberTexture(t, audioBands);
      updateAutoFlowTimer(dt);
      if (portalTransitionSystem) {
        portalTransitionSystem.update(dt, audioBands);
      }

      // Acoustic Sub-Bass Camera FOV Breathing
      const targetFov = 55.0 + (audioBands.sub * 4.5);
      camera.fov += (targetFov - camera.fov) * 0.15;
      camera.updateProjectionMatrix();

      // Anamorphic Lens Flare Glint on Transient Spikes
      const glintEl = document.getElementById('glint-flare');
      if (glintEl) {
        if (audioBands.transient > 0.82 && Math.random() < 0.35) {
          glintEl.classList.add('active');
        } else {
          glintEl.classList.remove('active');
        }
      }

      // Camera Smooth Vertigo Roll / Flip Inversion
      camRollAngle += (targetCamRoll - camRollAngle) * 0.12;
      camera.up.set(Math.sin(camRollAngle), Math.cos(camRollAngle), 0);
      camera.up.normalize();

      // Autonomous Camera Choreography
      camDist += (targetCamDist - camDist) * 0.05;

      // Autonomous Front-Facing Cinematic Camera Sway (Resumes 2.5s after user interaction)
      // Strictly constrained to front viewing arc so the camera NEVER orbits behind character or stage!
      if (now - lastUserInteractTime > 2500) {
        const speedMultiplier = CAM_SPEED_MULT[camSpeedMode];
        const currentScene = (activeSceneIdx >= 0 && SCENES[activeSceneIdx]) ? SCENES[activeSceneIdx] : null;
        const baseY = (currentScene && currentScene.camTargetY !== undefined) ? currentScene.camTargetY : 1.2;
        const lookY = (currentScene && currentScene.lookAtY !== undefined) ? currentScene.lookAtY : 0.8;

        if (speedMultiplier === 0) {
          // "Locked" Mode: Rock-solid locked center stage view
          camera.position.x = 0;
          camera.position.y = baseY;
          camera.position.z = camDist;
          camera.lookAt(0, lookY, 0);
        } else {
          // Front-facing cinematic parallax sway
          const maxSway = (currentScene && currentScene.maxSway !== undefined) ? currentScene.maxSway : 0.26;
          const swayAngle = Math.sin(t * 0.18 * speedMultiplier) * maxSway;
          const hVar = (currentScene && currentScene.camHeightVariance !== undefined) ? currentScene.camHeightVariance : 0.35;
          const camHeight = baseY + Math.sin(t * 0.12 * speedMultiplier) * hVar;

          camera.position.x = Math.sin(swayAngle) * camDist;
          camera.position.z = Math.cos(swayAngle) * camDist;
          camera.position.y = camHeight;
          camera.lookAt(0, lookY, 0);
        }
      } else {
        controls.update();
      }

      // Update Active Scene
      if (activeSceneIdx >= 0 && SCENES[activeSceneIdx]) {
        try {
          SCENES[activeSceneIdx].update(t, audioBands);
          if (SCENES[activeSceneIdx].backdrop) {
            updateLivingBackdrop(SCENES[activeSceneIdx].backdrop, t, dt, audioBands);
          }
        } catch (e) {
          console.warn("Scene update error:", e);
        }
      }

      // Dynamic Scene-Dependent Atmospheric Fog & Mist Interpolation
      if (scene && scene.fog) {
        const curAtm = SCENE_ATMOSPHERES[activeSceneIdx] || SCENE_ATMOSPHERES[0];
        let targetFogDensity = curAtm.fogDensity;
        const targetFogCol = new THREE.Color(curAtm.fogColor);

        // Storm atmospheric swell: thickens fog and flashes with lightning
        if (stormIntensity > 0.001) {
          targetFogDensity *= (1.0 + stormIntensity * 2.2);
          targetFogCol.lerp(new THREE.Color(0xdbeafe), Math.min(1.0, stormIntensity * 0.8));
        }

        scene.fog.color.lerp(targetFogCol, 0.06);
        scene.fog.density += (targetFogDensity - scene.fog.density) * 0.06;

        // Dynamic Dry Ice Stage Mist Floor Color Harmonization
        if (stageMistMat1 && stageMistMat2) {
          stageMistMat1.color.lerp(new THREE.Color(curAtm.mistColor1), 0.06);
          stageMistMat2.color.lerp(new THREE.Color(curAtm.mistColor2), 0.06);
          stageMistMat1.opacity = 0.22 + audioBands.sub * 0.12;
          stageMistMat2.opacity = 0.18 + audioBands.transient * 0.10;
        }

        // Floating Dust Motes Color
        if (stageDustMesh && stageDustMesh.material) {
          stageDustMesh.material.color.lerp(new THREE.Color(curAtm.dustColor), 0.06);
          stageDustMesh.material.opacity = 0.45 + audioBands.energy * 0.25;
        }
      }

      // 3D Storm Electric Arcs Decay, Camera Shudder, & Incandescent Lightning Light
      if (stormIntensity > 0.001) {
        stormIntensity *= Math.exp(-4.2 * dt);
        if (stormLinesMesh) stormLinesMesh.material.opacity = Math.min(1.0, stormIntensity * 1.5);
        if (stormLight) stormLight.intensity = stormIntensity * 28.0;
        ambLight.intensity = 0.38 + stormIntensity * 5.0;
      } else {
        if (stormLinesMesh) stormLinesMesh.material.opacity = 0.0;
        if (stormLight) stormLight.intensity = 0.0;
        ambLight.intensity = isBlackout ? 0.05 : 0.38;
      }

      // Sonic Thunder Camera Shudder Shockwave
      if (camShudder > 0.01) {
        camShudder *= 0.86;
        camera.position.x += (Math.random() - 0.5) * camShudder * 1.8;
        camera.position.y += (Math.random() - 0.5) * camShudder * 1.8;
      }

      // Dynamic Interactive Color Shift / Tint Modulation
      if (colorShiftMode === 1) {
        // Crimson Ruby Fury
        dirLight1.color.setHex(0xff1122);
        dirLight2.color.setHex(0xffffff);
        ambLight.color.setRGB(0.12, 0.02, 0.03);
      } else if (colorShiftMode === 2) {
        // Solar Gold & Sacred Amber
        dirLight1.color.setHex(0xf59e0b);
        dirLight2.color.setHex(0xd97706);
        ambLight.color.setRGB(0.12, 0.08, 0.02);
      } else if (colorShiftMode === 3) {
        // Cyber Violet & Ultraviolet
        dirLight1.color.setHex(0xa855f7);
        dirLight2.color.setHex(0x38bdf8);
        ambLight.color.setRGB(0.06, 0.02, 0.12);
      } else {
        // Default Key/Matte Harmonized
        dirLight1.color.setHex(0xffffff);
        dirLight2.color.setHex(0xff1122);
      }

      // Dynamic Storm Rain Particle System Update
      if (typeof updateStageRain === 'function') {
        updateStageRain(dt, audioBands, stormIntensity);
      }

      if (isBlackout) {
        renderer.toneMappingExposure = 0.40; // Moody low-light silhouette rather than pitch-black freeze
      } else {
        renderer.toneMappingExposure = 1.25 + audioBands.transient * 0.30;
      }

      // Extraordinary Subtle Backdrop Micro-Shift & Ambient Light Breathing
      // Moves a tiny tiny tiny bit to pan left, then gently pauses in black (Extraordinarily subtle)
      const cycleT = (t % 36.0) / 36.0; // 36-second cinematic micro-cycle
      let panOffset = 0.0;
      let blackFade = 1.0;

      if (cycleT < 0.45) {
        // Slow hypnotic micro-pan to the left (moves ~0.028 radians = ~1.6 degrees)
        const pProgress = cycleT / 0.45;
        const smoothP = 0.5 - 0.5 * Math.cos(pProgress * Math.PI);
        panOffset = -smoothP * 0.028;
        blackFade = 1.0;
      } else if (cycleT < 0.70) {
        // Pause in place, softly melting into deep contrast black
        const pauseProgress = (cycleT - 0.45) / 0.25;
        const dip = Math.sin(pauseProgress * Math.PI);
        panOffset = -0.028; // holds position
        blackFade = 1.0 - dip * 0.22; // subtle melt into black pause
      } else {
        // Extremely gentle return drift to center
        const returnProgress = (cycleT - 0.70) / 0.30;
        const smoothR = 0.5 - 0.5 * Math.cos(returnProgress * Math.PI);
        panOffset = -0.028 * (1.0 - smoothR);
        blackFade = 1.0;
      }

      // Universal Matte Backdrop Micro-Shift, Living Texture Drift, & Breathing
      if (activeSceneIdx >= 0 && SCENES[activeSceneIdx] && SCENES[activeSceneIdx].backdrop) {
        const bd = SCENES[activeSceneIdx].backdrop;
        if (bd && bd.userData) {
          bd.rotation.y = panOffset + Math.sin(t * 0.03) * 0.006;
          const targetOpacity = bd.userData.baseOpacity * blackFade * (0.90 + 0.10 * Math.sin(t * 0.25) + audioBands.sub * 0.12);
          if (bd.material) {
            bd.material.opacity = Math.min(1.0, targetOpacity);
            // Living Looping Animation: Subtle atmospheric cloud/sky UV drift
            if (bd.material.map) {
              bd.material.map.offset.x = (t * 0.00035) % 1.0;
            }
          }
          bd.position.y = bd.userData.baseY + Math.sin(t * 0.15) * 0.8;
          // Organic breathing scale
          const bScale = 1.0 + Math.sin(t * 0.18) * 0.006;
          bd.scale.set(bScale, bScale, bScale);
        }
      }

      // Extremely soft ambient light change (breathing color temperature)
      const ambBreathing = Math.sin(t * 0.2); // 31 second period
      const ambIntensity = isBlackout ? 0.04 : (0.34 + ambBreathing * 0.06);
      ambLight.intensity = ambIntensity;
      const ambWarmth = (Math.sin(t * 0.14) + 1.0) * 0.5; // 0 to 1
      ambLight.color.setRGB(
        0.04 + ambWarmth * 0.03, // red/gold warmth
        0.05 + ambWarmth * 0.02, // green
        0.10 - ambWarmth * 0.03  // deep royal cobalt base
      );

      // Atmospheric Mist Floor & Concert Dust Dynamics
      if (stageMistGroup && stageMistGroup.children.length >= 2) {
        stageMistGroup.children[0].rotation.z = t * 0.015;
        stageMistGroup.children[1].rotation.z = -t * 0.02;
        stageMistGroup.children[0].material.opacity = 0.20 + audioBands.sub * 0.14;
        stageMistGroup.children[1].material.opacity = 0.16 + audioBands.midBass * 0.12;
      }
      if (stageDustMesh) {
        const dPos = stageDustMesh.geometry.attributes.position.array;
        for (let i = 1; i < dPos.length; i += 3) {
          dPos[i] += 0.035;
          if (dPos[i] > 28) dPos[i] = -22;
        }
        stageDustMesh.geometry.attributes.position.needsUpdate = true;
        stageDustMesh.rotation.y = t * 0.012;
      }

      // Cinematic Film Grain Animation
      if (frameCount % 3 === 0) {
        updateCinematicGrain();
      }

      // Render WebGL
      if (composer) {
        try {
          composer.render();
        } catch (e) {
          renderer.render(scene, camera);
        }
      } else {
        renderer.render(scene, camera);
      }

      drawSpectrumMonitor();
    }

    // =========================================================================
    // 6. BOOTSTRAP INITIALIZATION
    // =========================================================================
    window.addEventListener('DOMContentLoaded', () => {
      // 1. Dual-Screen Broadcast Sync (0ms latency between DJ cockpit & LED stage screen)
      window.syncChannel = new BroadcastChannel('sol_roth_visuals');
      window.syncChannel.onmessage = (e) => {
        const data = e.data;
        if (!data) return;
        if (data.type === 'switchScene' && typeof data.idx === 'number') {
          switchScene(data.idx, false);
        } else if (data.type === 'triggerEvent' && data.name) {
          triggerEvent(data.name, false);
        } else if (data.type === 'setPose' && typeof data.idx === 'number') {
          triggerScenePose(data.idx);
        } else if (data.type === 'resetCam') {
          resetSceneCamera();
        } else if (data.type === 'setStory' && typeof data.storyIdx === 'number') {
          setStorySet(data.storyIdx, false);
        } else if (data.type === 'setAutoFlow' && typeof data.mode === 'number') {
          autoFlowMode = data.mode;
          autoFlowRemaining = AUTO_FLOW_TIMES[autoFlowMode];
          updateAutoFlowButton();
        } else if (data.type === 'portalState') {
          if (portalTransitionSystem) {
            if (typeof data.open === 'boolean') portalTransitionSystem.setOpen(data.open, false);
            if (typeof data.style === 'number') portalTransitionSystem.setStyle(data.style, false);
            if (typeof data.auto === 'boolean') portalTransitionSystem.setAuto(data.auto, false);
          }
        }
      };

      const params = new URLSearchParams(window.location.search);
      if (params.get('mode') === 'stage') {
        document.body.classList.add('stage-mode');
      }

      // 2. Story Selection & Dynamic Tier 2 Button Rendering
      const storyParam = params.get('story');
      if (storyParam === 'aura' || storyParam === '2') {
        currentStoryIdx = 1;
        SCENES = STORY_SETS[1].scenes;
        const btnStory = document.getElementById('btn-story-select');
        if (btnStory) btnStory.textContent = `📚 Story: ${STORY_SETS[1].shortTitle}`;
      }
      renderSceneButtons();

      const flowParam = parseInt(params.get('flow'));
      if (!isNaN(flowParam) && flowParam >= 0 && flowParam < AUTO_FLOW_TIMES.length) {
        autoFlowMode = flowParam;
        autoFlowRemaining = AUTO_FLOW_TIMES[autoFlowMode];
        updateAutoFlowButton();
      }

      // 3. Initialize Three.js Engine & Textures
      try { initThree(); } catch (e) { console.error("initThree error:", e); }
      try { initCyberTexture(); } catch (e) { console.error("initCyberTexture error:", e); }
      try { initVideoTextures(); } catch (e) { console.error("initVideoTextures error:", e); }

      // 4. Initial Scene Switch
      const urlScene = parseInt(params.get('scene'));
      const hasUrlScene = !isNaN(urlScene) && urlScene >= 1 && urlScene <= SCENES.length;
      const startIdx = hasUrlScene ? (urlScene - 1) : 0;
      if (hasUrlScene) {
        lastUserSceneSelectTime = Date.now() + 86400000; // Lock to requested URL scene indefinitely
      }
      switchScene(startIdx, hasUrlScene);
      updateCharacterControlButtons();

      if (params.get('event')) {
        setTimeout(() => triggerEvent(params.get('event')), 500);
      }
      if (params.get('billboard') === '1') {
        setTimeout(() => toggleBillboard(), 500);
      }
      window.addEventListener('dblclick', toggleFullscreen);
      animate();
    });
  </script>
</body>
</html>
